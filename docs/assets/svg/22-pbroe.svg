<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-22p desc-22p"><title id="title-22p">PB—ROE关系从稳态分红模型中推导</title><desc id="desc-22p">ROE=12%、g=4%、股权资本成本Ke=10%，合理PB≈1.33。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">PB—ROE关系从稳态分红模型中推导</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">ROE=12%、g=4%、股权资本成本Ke=10%，合理PB≈1.33。</text><rect x="40" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="40" y="140" width="8" height="150" rx="3" fill="#147f80"/><text x="59" y="172" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">ROE</text><text x="59" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">持续盈利能力12%</text><text x="59" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">须检查权益质量</text><path d="M243.25 213L261.25 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="266.25" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="266.25" y="140" width="8" height="150" rx="3" fill="#7461ba"/><text x="285.25" y="172" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">增长g</text><text x="285.25" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">长期稳定4%</text><text x="285.25" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">与再投资相容</text><path d="M469.5 213L487.5 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="492.5" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="492.5" y="140" width="8" height="150" rx="3" fill="#916c22"/><text x="511.5" y="172" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">股权成本Ke</text><text x="511.5" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">股权要求收益10%</text><text x="511.5" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">且Ke&gt;g</text><path d="M695.75 213L713.75 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="718.75" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="718.75" y="140" width="8" height="150" rx="3" fill="#d06d4d"/><text x="737.75" y="172" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">PB</text><text x="737.75" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">(ROE−g)/(Ke−g)</text><text x="737.75" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">≈1.33</text><rect x="50" y="328" width="860" height="66" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="75" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">模型需要清洁盈余、稳定ROE、稳态分红等限制，不是通用恒等式。</text></svg>