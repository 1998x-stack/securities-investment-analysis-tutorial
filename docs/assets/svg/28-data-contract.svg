<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">综合项目的数据契约与时间顺序</title><desc id="desc">把证券主数据、财务版本、市场数据和模型输出分开保存；每个字段都保留单位、来源、可用时间与版本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<text x="480" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">不是一个无限增长的 DataFrame，而是有主键和时间语义的研究数据集</text>
<rect x="30" y="95" width="200" height="100" rx="13" fill="#e8f2ef" stroke="#53676d" stroke-opacity=".35"/><text x="130" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">证券主数据</text><text x="130" y="156" text-anchor="middle" font-size="15" fill="#53676d">代码 / 市场 / 存续区间</text>
<rect x="270" y="95" width="200" height="100" rx="13" fill="#f7f3e9" stroke="#53676d" stroke-opacity=".35"/><text x="370" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">财务事实</text><text x="370" y="156" text-anchor="middle" font-size="15" fill="#53676d">报告期 / 公告时点 / 版本</text>
<rect x="510" y="95" width="200" height="100" rx="13" fill="#eeeaf7" stroke="#53676d" stroke-opacity=".35"/><text x="610" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">市场行情</text><text x="610" y="156" text-anchor="middle" font-size="15" fill="#53676d">交易日 / 公司行动 / 复权</text>
<rect x="750" y="95" width="180" height="100" rx="13" fill="#f9e9e2" stroke="#53676d" stroke-opacity=".35"/><text x="840" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">外部数据</text><text x="840" y="156" text-anchor="middle" font-size="15" fill="#53676d">宏观 / 新闻 / 授权</text>
<path d="M130 195 V245 H480 M370 195 V245 M610 195 V245 M840 195 V245 H480" fill="none" stroke="#147f80" stroke-width="3"/>
<rect x="225" y="245" width="510" height="90" rx="13" fill="#e8f2ef" stroke="#147f80"/><text x="480" y="281" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">Point-in-time 特征表</text><text x="480" y="311" text-anchor="middle" font-size="15" fill="#53676d">source_id · available_at · period_end · unit · version</text>
<text x="480" y="390" text-anchor="middle" font-size="15" fill="#d06d4d">任何决策时点只能读取当时已经可用的记录</text></svg>