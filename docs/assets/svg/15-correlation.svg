<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">等权组合方差与相关系数</title><desc id="d">两个标准差均20%的资产，等权组合在相关系数1、0、-1下的标准差分别为20%、14.14%、0%。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="38" y="43" font-size="22" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">两种资产各波动20%，相关系数改变后组合风险仍不同</text><rect x="47" y="105" width="271" height="230" fill="#fff" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><text x="64" y="147" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#d06d4d">ρ=+1</text><text x="64" y="181" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="400" text-anchor="start" fill="#53676d">完全同向</text><rect x="72" y="215" width="220" height="28" fill="#e8f0ec" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><rect x="72" y="215" width="220" height="28" fill="#d06d4d" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><text x="182" y="289" font-size="24" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="middle" fill="#d06d4d">20.00%</text><rect x="355" y="105" width="271" height="230" fill="#fff" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><text x="372" y="147" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#916c22">ρ=0</text><text x="372" y="181" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="400" text-anchor="start" fill="#53676d">线性不相关</text><rect x="380" y="215" width="220" height="28" fill="#e8f0ec" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><rect x="380" y="215" width="155.56349186104046" height="28" fill="#916c22" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><text x="490" y="289" font-size="24" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="middle" fill="#916c22">14.14%</text><rect x="663" y="105" width="271" height="230" fill="#fff" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><text x="680" y="147" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#147f80">ρ=−1</text><text x="680" y="181" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="400" text-anchor="start" fill="#53676d">理想完全反向</text><rect x="688" y="215" width="220" height="28" fill="#e8f0ec" stroke="#c7d8d2" rx="10" stroke-width="1.4"/><text x="798" y="289" font-size="24" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="middle" fill="#147f80">0.00%</text><text x="42" y="375" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">等权、两资产标准差均20%、无卖空。ρ=0 时 σp=√200≈14.14%。</text><text x="42" y="416" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="400" text-anchor="start" fill="#53676d">相关性可能在危机时改变；ρ=−1的零风险只对严格稳定且等波动的理想模型成立。</text></svg>