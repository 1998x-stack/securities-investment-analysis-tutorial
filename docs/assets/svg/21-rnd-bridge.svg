<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-21r desc-21r"><title id="title-21r">研发投入如何转成价值？中间可能有很多失败</title><desc id="desc-21r">研发强度是一项投入强度指标；企业价值取决于成功后的现金回报。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">研发投入如何转成价值？中间可能有很多失败</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">研发强度是一项投入强度指标；企业价值取决于成功后的现金回报。</text><rect x="40" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="40" y="140" width="8" height="150" rx="3" fill="#147f80"/><text x="59" y="172" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">研究资源</text><text x="59" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">费用化和资本化</text><text x="59" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">人员与实验成本</text><path d="M243.25 213L261.25 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="266.25" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="266.25" y="140" width="8" height="150" rx="3" fill="#7461ba"/><text x="285.25" y="172" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">技术成果</text><text x="285.25" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">能力积累与专利</text><text x="285.25" y="223" 