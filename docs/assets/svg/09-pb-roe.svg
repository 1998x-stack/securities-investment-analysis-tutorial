<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">PB与ROE稳定增长模型</title><desc id="fig-desc">在增长4%、权益成本10%时，理论PB随ROE8至16%增加，非实际市场数据。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="38" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">PB不只取决于账面净资产，还取决于可持续ROE与资本成本</text><path d="M105 92L105 348" fill="none" stroke="#203035" stroke-width="2"/><path d="M105 348L886 348" fill="none" stroke="#203035" stroke-width="2"/><path d="M105 348L882 348" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="93" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">0.0×</text><path d="M105 295.5L882 295.5" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="93" y="300.5" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">0.5×</text><path d="M105 243L882 243" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="93" y="248" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">1.0×</text><path d="M105 190.5L882 190.5" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="93" y="195.5" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">1.5×</text><path d="M105 138L882 138" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="93" y="143" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">2.0×</text><path d="M165 278 L334 243 L503 208.00000000000003 L672 173.00000000000003 L841 138.00000000000003" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="165" cy="278" r="6" fill="#147f80"/><text x="165" y="262" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">0.67×</text><text x="165" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">8%</text><circle cx="334" cy="243" r="6" fill="#147f80"/><text x="334" y="227" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">1.00×</text><text x="334" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">10%</text><circle cx="503" cy="208.00000000000003" r="6" fill="#147f80"/><text x="503" y="192.00000000000003" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">1.33×</text><text x="503" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">12%</text><circle cx="672" cy="173.00000000000003" r="6" fill="#147f80"/><text x="672" y="157.00000000000003" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">1.67×</text><text x="672" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">14.000000000000002%</text><circle cx="841" cy="138.00000000000003" r="6" fill="#147f80"/><text x="841" y="122.00000000000003" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">2.00×</text><text x="841" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">16%</text><text x="38" y="417" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">稳定增长模型：PB=(ROE−g)/(kₑ−g)，仅在增长g=4%、权益成本kₑ=10%等假设成立时。</text></svg>
