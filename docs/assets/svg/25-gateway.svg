<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-25g desc-25g"><title id="title-25g">研究、风控、券商适配器和回报处理必须分层</title><desc id="desc-25g">QMT/PTrade接入由券商授权、实际版本和监管规则决定。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">研究、风控、券商适配器和回报处理必须分层</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">QMT/PTrade接入由券商授权、实际版本和监管规则决定。</text><rect x="40" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="40" y="140" width="8" height="150" rx="3" fill="#147f80"/><text x="59" y="172" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">研究系统</text><text x="59" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">目标仓位与信号</text><text x="59" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">不接触真实账户</text><path d="M243.25 213L261.25 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="266.25" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="266.25" y="140" width="8" height="150" rx="3" fill="#7461ba"/><text x="285.25" y="172" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">风控闸门</text><text x="285.25" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">持仓、频率、额度</text><text x="285.25" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">紧急停机开关</text><path d="M469.5 213L487.5 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="492.5" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="492.5" y="140" width="8" height="150" rx="3" fill="#916c22"/><text x="511.5" y="172" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">券商适配器</text><text x="511.5" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">鉴权、幂等、重试</text><text x="511.5" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">按官方接口版本</text><path d="M695.75 213L713.75 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="718.75" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="718.75" y="140" width="8" height="150" rx="3" fill="#d06d4d"/><text x="737.75" y="172" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">交易回报</text><text x="737.75" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">Ack/拒绝/部分成交</text><text x="737.75" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">账户与订单对账</text><rect x="50" y="328" width="860" height="66" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="75" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">样例代码仅纸面交易，不含真实券商连接与认证。</text></svg>