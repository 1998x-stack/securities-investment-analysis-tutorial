gb(255, 255, 255);stroke:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="315" y="110" font-size="12" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">B · 5/1</text><rect x="370" y="90" width="110" height="30" fill="#ffffff" stroke="#d06d4d" style=";fill:rgb(255, 255, 255);stroke:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="425" y="110" font-size="12" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">B · 5/2</text><path d="M150 125L285 155" stroke="#d06d4d" stroke-width="2" style=";fill:rgb(0, 0, 0);stroke:rgb(208, 109, 77);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="500" y="112" font-size="12" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quo