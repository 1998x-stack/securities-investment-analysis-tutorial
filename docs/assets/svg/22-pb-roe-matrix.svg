<svg data-export="22-pb-roe-matrix" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="f22a-t f22a-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="f22a-t" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">PB-ROE 四象限矩阵</title><desc id="f22a-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">横轴为净资产收益率，纵轴为市净率，四个象限分别对应高ROE高PB、高ROE低PB、低ROE高PB、低ROE低PB四类行业定位。</desc><rect width="720" height="420" rx="14" fill="#f3f7f5" style=";fill:rgb(243, 247, 245);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="38" font-size="19" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:19px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">PB-ROE 矩阵：同一个 PB，在不同 ROE 下含义不同</text><g font-family="Arial,'Microsoft YaHei',sans-serif" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><path d="M100 70L100 360L670 360" stroke="#203035" stroke-width="2" fill="none" style=";stroke:rgb(32, 48, 53);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M100 215L670 215" stroke="#53676d" stroke-width="1.5" stroke-dasharray="6 5" style=";fill:rgb(0, 0, 0);stroke:rgb(83, 103, 109);stroke-width:1.5px;stroke-dasharray:6px, 5px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M385 70L385 360" stroke="#53676d" stroke-width="1.5" stroke-dasharray="6 5" style=";fill:rgb(0, 0, 0);stroke:rgb(83, 103, 109);stroke-width:1.5px;stroke-dasharray:6px, 5px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="360" y="392" font-size="14" font-weight="700" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">ROE →</text><text x="40" y="80" font-size="14" font-weight="700" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">PB ↑</text><text x="140" y="130" font-size="14" fill="#147f80" style=";fill:rgb(20, 127, 128);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">高ROE·高PB</text><text x="140" y="152" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">优质赛道，溢价已充分</text><text x="420" y="130" font-size="14" fill="#7461ba" style=";fill:rgb(116, 97, 186);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">高ROE·低PB</text><text x="420" y="152" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">可能的低估区，需查风险</text><text x="140" y="300" font-size="14" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">低ROE·高PB</text><text x="140" y="322" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">依赖敊事与预期</text><text x="420" y="300" font-size="14" fill="#147f80" style=";fill:rgb(20, 127, 128);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">低ROE·低PB</text><text x="420" y="322" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">周期低谷或强衰退</text><text x="40" y="412" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">教学示意：象限仅表示相对位置，不代表买卖建议。</text></g></svg>
