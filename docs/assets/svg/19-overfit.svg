<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">过拟合：样本内误差持续下降，样本外误差先降后升</title><desc id="d">模型复杂度增加时，样本内误差单调下降，样本外误差呈U形：经过一个最优点后继续增加复杂度，样本外表现反而变差，即过拟合。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">样本内越来越好看，不代表样本外越来越好</text><path d="M120 80L120 380L880 380" stroke="#203035" stroke-width="2" fill="none"/><path d="M120 225.0 L157 247.2 L194 266.1 L231 282.2 L268 295.9 L305 307.6 L342 317.6 L379 326.1 L416 333.3 L453 339.5 L490 344.7 L527 349.2 L564 353.0 L601 356.3 L638 359.0 L675 361.4 L712 363.4 L749 365.1 L786 366.6 L823 367.8 L860 368.9" fill="none" stroke="#147f80" stroke-width="3.5"/><path d="M120 225.0 L157 247.2 L194 266.1 L231 282.2 L268 295.9 L305 307.6 L342 317.6 L379 323.4 L416 324.6 L453 322.2 L490 316.6 L527 308.1 L564 297.0 L601 283.5 L638 267.8 L675 249.9 L712 230.0 L749 208.3 L786 184.7 L823 159.5 L860 132.6" fill="none" stroke="#d06d4d" stroke-width="3.5" stroke-dasharray="8 5"/><path d="M342 250L342 380" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5" fill="none"/><circle cx="342" cy="317.6" r="5.5" fill="#7461ba"/><text x="352" y="332" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#7461ba">样本外误差最低点</text><circle cx="860" cy="132.6" r="5.5" fill="#d06d4d"/><text x="700" y="120" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">过拟合区：样本内好、样本外差</text><text x="150" y="240" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#147f80">样本内误差</text><text x="150" y="200" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">样本外误差</text><text x="800" y="404" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">模型复杂度 →</text><text x="40" y="432" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：曲线形状由两条构造函数绘出，用于说明“样本内下降不等于样本外改善”，与任何具体策略无关。</text></svg>
