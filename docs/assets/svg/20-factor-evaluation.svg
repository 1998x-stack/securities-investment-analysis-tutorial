<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r20e d-r20e"><title id="t-r20e">从横截面预测到时间序列稳定性：IC与ICIR回答不同问题</title><desc id="d-r20e">IC比较当期股票排序与未来收益；ICIR描述IC序列的稳定程度，不等于策略净收益。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">从横截面预测到时间序列稳定性：IC与ICIR回答不同问题</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">IC比较当期股票排序与未来收益；ICIR描述IC序列的稳定程度，不等于策略净收益。</text><rect x="45" y="125" width="395" height="230" rx="10" fill="#fff" stroke="#c7d8d2"/><text x="65" y="155" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">单期横截面：预测分数 vs 后续收益</text><circle cx="85" cy="300" r="5" fill="#147f80" opacity=".85"/><circle cx="112" cy="276.9023481823052" r="5" fill="#147f80" opacity=".85"/><circle cx="139" cy="263.0884308780918" r="5" fill="#147f80" opacity=".85"/><circle cx="166" cy="259.3065599032816" r="5" fill="#147f80" opacity=".85"/><circle cx="193" cy="257.08162994369513" r="5" fill="#147f80" opacity=".85"/><circle cx="220" cy="246.50709129595765" r="5" fill="#147f80" opacity=".85"/><circle cx="247" cy="225.3529859783871" r="5" fill="#147f80" opacity=".85"/><circle cx="274" cy="201.11616081537454" r="5" fill="#147f80" opacity=".85"/><circle cx="301" cy="184.1277010405194" r="5" fill="#147f80" opacity=".85"/><circle cx="328" cy="288.0545781770989" r="5" fill="#147f80" opacity=".85"/><circle cx="355" cy="286.52825333067244" r="5" fill="#147f80" opacity=".85"/><circle cx="382" cy="278.99988247860847" r="5" fill="#147f80" opacity=".85"/><path d="M80 315 L395 190" stroke="#d06d4d" stroke-width="2.5" stroke-dasharray="6 5"/><text x="245" y="340" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">横截面相关 = ICₜ</text><path d="M445 240 L500 240" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="510" y="125" width="405" height="230" rx="10" fill="#fff" stroke="#c7d8d2"/><text x="530" y="155" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">跨期：每月/每期计算一次 IC</text><path d="M540 275 L590 230 L640 255 L690 200 L740 245 L790 215 L840 260 L890 190" fill="none" stroke="#7461ba" stroke-width="3"/><path d="M540 290 H890" stroke="#c7d8d2" stroke-width="1.5" stroke-dasharray="5 5"/><text x="710" y="325" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#7461ba">均值 / 标准差 = ICIR</text><text x="480" y="410" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">统计预测排序能力 ≠ 计入换手、冲击成本后的可实现收益。</text></svg>