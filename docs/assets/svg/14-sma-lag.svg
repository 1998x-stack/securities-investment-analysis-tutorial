<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">收盘价与三期简单移动平均对照</title><desc id="desc">构造12期收盘价和三期SMA，SMA从第三期开始，显示平滑和滞后。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">三期平均缓和噪声，也不可避免滞后</text><path d="M86 95L86 353" fill="none" stroke="#203035" stroke-width="2" /><path d="M86 353L895 353" fill="none" stroke="#203035" stroke-width="2" /><path d="M115 239 L184 225 L253 211 L322 141 L391 99 L460 169 L529 253 L598 295 L667 225 L736 183 L805 141 L874 113" fill="none" stroke="#d06d4d" stroke-width="3"/><path d="  M253 225 L322 192.3333333333334 L391 150.3333333333334 L460 136.3333333333334 L529 173.6666666666666 L598 239 L667 257.66666666666663 L736 234.3333333333334 L805 183 L874 145.6666666666666" fill="none" stroke="#147f80" stroke-width="4"/><text x="594" y="110" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#d06d4d" text-anchor="start">收盘价</text><text x="737" y="110" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#147f80" text-anchor="start">3期SMA</text><text x="41" y="419" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">交易信号使用已完成的t期数据；在t日收盘前不能提前知道当日收盘SMA。</text></svg>
