<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r19p d-r19p"><title id="t-r19p">财报所属期不等于投资者当时已经知道它</title><desc id="d-r19p">避免把未来披露的数据回填到历史交易日；信号应在公开可用时间之后生成。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">财报所属期不等于投资者当时已经知道它</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">避免把未来披露的数据回填到历史交易日；信号应在公开可用时间之后生成。</text><path d="M85 260 H880" stroke="#53676d" stroke-width="3"/><path d="M130 245 V275" stroke="#916c22" stroke-width="3"/><path d="M360 245 V275" stroke="#147f80" stroke-width="3"/><path d="M590 245 V275" stroke="#7461ba" stroke-width="3"/><path d="M820 245 V275" stroke="#d06d4d" stroke-width="3"/><text x="130" y="215" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#916c22">财报期末</text><text x="360" y="215" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#147f80">正式披露</text><text x="590" y="215" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#7461ba">信号生成</text><text x="820" y="215" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#d06d4d">允许成交</text><text x="130" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">Q1 结束</text><text x="360" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">T+若干日</text><text x="590" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">披露后</text><text x="820" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">下一可交易时点</text><rect x="130" y="110" width="230" height="58" rx="9" fill="#fff4e6" stroke="#916c22"/><text x="245" y="145" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#916c22">不可使用：未来信息</text><path d="M245 170 V190" stroke="#916c22" stroke-width="2" stroke-dasharray="5 5"/><rect x="440" y="355" width="400" height="52" rx="9" fill="#e9f5f1" stroke="#147f80"/><text x="640" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">标签：披露后未来收益，不能与特征同期</text></svg>