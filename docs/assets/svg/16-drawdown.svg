<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">回撤幅度与回本所需涨幅的关系</title><desc id="d">曲线显示亏损越深，回本所需涨幅以非线性方式上升：亏20%需涨25%，亏50%需涨100%，亏80%需涨400%。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">回本所需涨幅 = 1/(1−回撤) − 1，不是把亏损幅度加回去</text><path d="M120 96L120 380L880 380" stroke="#203035" stroke-width="2" fill="none"/><path d="M120.0 380.0 L167.5 376.1 L215.0 371.9 L262.5 367.1 L310.0 361.7 L357.5 355.6 L405.0 348.6 L452.5 340.5 L500.0 331.1 L547.5 320.0 L595.0 306.7 L642.5 290.4 L690.0 270.0 L737.5 243.8 L785.0 208.9 L832.5 160.0 L880.0 86.7" fill="none" stroke="#147f80" stroke-width="3.5"/><circle cx="310" cy="361.7" r="5.5" fill="#d06d4d"/><text x="322" y="356" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">−20% → +25%</text><circle cx="595" cy="306.7" r="5.5" fill="#d06d4d"/><text x="607" y="300" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">−50% → +100%</text><circle cx="880" cy="86.7" r="5.5" fill="#7461ba"/><text x="800" y="76" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#7461ba">−80% → +400%</text><text x="40" y="86" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">回本涨幅</text><text x="770" y="410" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">回撤幅度</text><text x="128" y="404" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">0</text><text x="286" y="404" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">20%</text><text x="443" y="404" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">40%</text><text x="600" y="404" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">60%</text><text x="757" y="404" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">80%</text><text x="40" y="432" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">曲线由 1/(1−d)−1 精确计算；假设标的可继续交易、无追加资金与费用，仅用于说明算术不对称。</text></svg>
