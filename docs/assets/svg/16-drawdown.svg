<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r16dd d-r16dd"><title id="t-r16dd">回撤以历史高水位为基准，而不是只看期末收益</title><desc id="d-r16dd">构造净值从125跌到90，最大回撤为28%；从90恢复到125需要上涨38.9%。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">回撤以历史高水位为基准，而不是只看期末收益</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">构造净值从125跌到90，最大回撤为28%；从90恢复到125需要上涨38.9%。</text><path d="M80 350 H885 M80 350 V115" fill="none" stroke="#53676d" stroke-width="2"/><path d="M90 280 L170 235 L250 250 L330 185 L410 155 L490 130 L570 190 L650 305 L730 265 L810 175 L870 135" fill="none" stroke="#147f80" stroke-width="5" stroke-linejoin="round"/><path d="M490 130 H650" fill="none" stroke="#916c22" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M650 130 V305" fill="none" stroke="#d06d4d" stroke-width="3" stroke-dasharray="7 6"/><circle cx="490" cy="130" r="7" fill="#916c22"/><circle cx="650" cy="305" r="7" fill="#d06d4d"/><text x="475" y="110" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#916c22">前高 125</text><text x="665" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d06d4d">谷底 90</text><text x="575" y="220" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#d06d4d">−28% MDD</text><text x="80" y="385" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203035">时间 →</text><text x="90" y="420" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">最大回撤 = 1 − 谷底净值 / 此前峰值</text><text x="800" y="105" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#147f80">回到125需 +38.9%</text></svg>