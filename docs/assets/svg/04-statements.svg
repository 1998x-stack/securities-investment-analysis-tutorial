<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="s-title s-desc"><title id="s-title">三张报表：观察同一家企业的三个角度</title><desc id="s-desc">资产负债表描述时点存量，利润表与现金流量表描述期间流量。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="420" rx="12" fill="#f3f7f5"/><text x="40" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">三张报表：观察同一家企业的三个角度</text><rect x="40" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#147f80" stroke-width="2"/><rect x="40" y="101" width="7" height="166" rx="3" fill="#147f80"/><text x="57" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">资产负债表</text><text x="57" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">某时点：资产 150</text><text x="57" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">负债 90 + 权益 60</text><path d="M322 184L338 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="340" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#7461ba" stroke-width="2"/><rect x="340" y="101" width="7" height="166" rx="3" fill="#7461ba"/><text x="357" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">利润表</text><text x="357" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">某期间：收入 100</text><text x="357" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">费用 82 → 利润 18</text><path d="M622 184L638 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="640" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="2"/><rect x="640" y="101" width="7" height="166" rx="3" fill="#d06d4d"/><text x="657" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">现金流量表</text><text x="657" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">某期间：现金流</text><text x="657" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">经营 / 投资 / 筹资</text><path d="M42 319H918" stroke="#c9d9d4" stroke-width="2"/><text x="46" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">资产=负债+权益；利润不等于经营现金流。</text><text x="46" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">数值为构造案例，完整财务报表还包括权益变动表与附注。</text></svg>
