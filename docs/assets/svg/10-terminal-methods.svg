<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">终值有两种常见算法，均非事实预测</title><desc id="svgDesc">对比永续增长法与退出倍数法计算终值。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">终值有两种常见算法，均非事实预测</text><rect x="39" y="100" width="431" height="200" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="39" y="100" width="7" height="200" rx="3" fill="#7461ba"/><text x="57" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">永续增长法</text><text x="57" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">TV5 = FCFF6/(WACC−g)</text><text x="57" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">依赖长期增长与资本成本</text><rect x="488" y="100" width="431" height="200" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="488" y="100" width="7" height="200" rx="3" fill="#147f80"/><text x="506" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">退出倍数法</text><text x="506" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">TV5 = EBITDA5 × 倍数</text><text x="506" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">依赖未来可比企业定价</text><path d="M40,339 L918,339" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="44" y="374" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">两种方法都要把第5年的终值折现回今天。</text><text x="44" y="402" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">交叉验证时要同时检查终值口径、周期位置、可比性与再投资。</text></svg>
