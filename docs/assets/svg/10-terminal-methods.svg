<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">永续增长法与退出倍数法的区别</title><desc id="fig-desc">五年显式预测期后，永续增长法和退出倍数法分别估计终值，禁止相加。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="36" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">终值方法只能择一：永续增长法与退出倍数法不是两笔钱</text><rect x="35" y="123" width="265" height="181" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="35" y="123" width="6" height="181" rx="3" fill="#7461ba"/><text x="51" y="155" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">显式期 1–5 年</text><text x="51" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">FCFF 每年 100</text><text x="51" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">WACC=10%</text><text x="51" y="233" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">期间现值≈379.08</text><path d="M300 212L354 212" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="365" y="73" width="250" height="134" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="365" y="73" width="6" height="134" rx="3" fill="#147f80"/><text x="381" y="105" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">A · 永续增长法</text><text x="381" y="135" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">第6年FCFF=102；g=2%</text><text x="381" y="159" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">第5年末终值1275</text><rect x="365" y="229" width="250" height="134" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="365" y="229" width="6" height="134" rx="3" fill="#d06d4d"/><text x="381" y="261" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">B · 退出倍数法</text><text x="381" y="291" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">第5年EBITDA=150</text><text x="381" y="315" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">终值=8×150=1200</text><path d="M615 141L662 194" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><path d="M615 293L662 250" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="676" y="156" width="244" height="164" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="676" y="156" width="6" height="164" rx="3" fill="#b28a37"/><text x="692" y="188" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">两种 EV（择一）</text><text x="692" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">A ≈ 1170.75</text><text x="692" y="242" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">B ≈ 1124.19</text><text x="692" y="266" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">不能把A与B终值相加</text><text x="39" y="417" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">终值影响往往很大，需做敏感性和可比公司估值自洽性检查。</text></svg>
