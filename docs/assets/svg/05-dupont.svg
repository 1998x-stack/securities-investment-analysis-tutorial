<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="s-title s-desc"><title id="s-title">杜邦框架：ROE 的来源</title><desc id="s-desc">净利率、资产周转率与权益乘数相乘为ROE，前提是口径一致。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="420" rx="12" fill="#f3f7f5"/><text x="40" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">杜邦框架：ROE 的来源</text><rect x="40" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#147f80" stroke-width="2"/><rect x="40" y="101" width="7" height="166" rx="3" fill="#147f80"/><text x="57" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">利润率</text><text x="57" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">净利润 / 收入</text><text x="57" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">8%</text><path d="M322 184L338 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="340" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#7461ba" stroke-width="2"/><rect x="340" y="101" width="7" height="166" rx="3" fill="#7461ba"/><text x="357" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">资产周转率</text><text x="357" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">收入 / 平均资产</text><text x="357" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">1.2 次</text><path d="M622 184L638 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="640" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="2"/><rect x="640" y="101" width="7" height="166" rx="3" fill="#d06d4d"/><text x="657" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">权益乘数</text><text x="657" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">平均资产 / 平均权益</text><text x="657" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">1.8 倍</text><path d="M42 319H918" stroke="#c9d9d4" stroke-width="2"/><text x="46" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">8% × 1.2 × 1.8 = 17.28%（模拟）。</text><text x="46" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">高 ROE 可以部分来自高杠杆；分解恒等式不等于因果证明。</text></svg>
