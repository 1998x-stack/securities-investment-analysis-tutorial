<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">前景理论的S型价值函数</title><desc id="d">以参考点为原点，收益侧曲线向上但逐渐变平，损失侧曲线向下且更陡（损失厌恶系数约2.25），说明同等幅度的损失主观影响大于收益。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">价值函数以参考点为原点，损失一侧比收益一侧更陡</text><path d="M120 200L880 200" stroke="#203035" stroke-width="2" fill="none"/><path d="M500 70L500 400" stroke="#203035" stroke-width="2" fill="none"/><path d="M120.0 370.7 L139.0 363.1 L158.0 355.6 L177.0 347.9 L196.0 340.2 L215.0 332.5 L234.0 324.7 L253.0 316.8 L272.0 308.9 L291.0 300.9 L310.0 292.7 L329.0 284.5 L348.0 276.2 L367.0 267.8 L386.0 259.2 L405.0 250.4 L424.0 241.4 L443.0 232.1 L462.0 222.5 L481.0 212.2 L500.0 200.0 L519.0 194.6 L538.0 190.0 L557.0 185.7 L576.0 181.6 L595.0 177.6 L614.0 173.7 L633.0 169.9 L652.0 166.1 L671.0 162.4 L690.0 158.8 L709.0 155.2 L728.0 151.6 L747.0 148.1 L766.0 144.6 L785.0 141.1 L804.0 137.7 L823.0 134.3 L842.0 130.9 L861.0 127.5 L880.0 124.1" fill="none" stroke="#147f80" stroke-width="3.5"/><circle cx="690" cy="158.8" r="5.5" fill="#147f80"/><text x="700" y="150" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#147f80">+5 → v≈+4.12</text><circle cx="310" cy="292.7" r="5.5" fill="#d06d4d"/><text x="60" y="318" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">−5 → v≈−9.27</text><text x="770" y="192" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">收益</text><text x="90" y="192" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">损失</text><text x="508" y="416" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">参考点 0</text><text x="40" y="432" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：v(x)=x^0.88（收益）、v(x)=−2.25(−x)^0.88（损失），参数取 Kahneman 与 Tversky（1979）的中位数估计，仅用于比较形状。</text></svg>
