<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r17 d-r17"><title id="t-r17">处置效应：同样面对卖出决策，盈亏标签会改变行为</title><desc id="d-r17">研究观察到部分投资者更倾向卖出盈利头寸、继续持有亏损头寸；不能据此诊断每个投资者。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">处置效应：同样面对卖出决策，盈亏标签会改变行为</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">研究观察到部分投资者更倾向卖出盈利头寸、继续持有亏损头寸；不能据此诊断每个投资者。</text><rect x="50" y="135" width="385" height="180" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="50" y="135" width="7" height="180" rx="4" fill="#147f80"/><text x="70" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">账面盈利：更快实现</text><text x="70" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">参考买入价 100 → 市价 120</text><text x="70" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">心理账户：把未实现收益变成已实现</text><text x="70" y="240" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">风险：过早卖出仍有基本面优势的资产</text><rect x="525" y="135" width="385" height="180" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="525" y="135" width="7" height="180" rx="4" fill="#d06d4d"/><text x="545" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">账面亏损：更久不愿卖</text><text x="545" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">参考买入价 100 → 市价 80</text><text x="545" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">心理账户：不愿承认损失已经发生</text><text x="545" y="240" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">风险：让沉没成本替代前瞻判断</text><text x="242" y="360" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">卖出倾向可能偏高</text><text x="717" y="360" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#d06d4d">持有倾向可能偏高</text><text x="480" y="414" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#203035">重新评估：若今天持有现金，会不会按当前价格重新买入？</text></svg>