<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="s-title s-desc"><title id="s-title">比较的是权利，不只是价格</title><desc id="s-desc">四种工具所对应的现金流权利与风险承担方式。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="420" rx="12" fill="#f3f7f5"/><text x="40" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">比较的是权利，不只是价格</text><rect x="40" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#147f80" stroke-width="2"/><rect x="40" y="101" width="7" height="166" rx="3" fill="#147f80"/><text x="57" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">股票</text><text x="57" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">剩余索取权</text><text x="57" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">分红不保证</text><path d="M247 184L263 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="265" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#7461ba" stroke-width="2"/><rect x="265" y="101" width="7" height="166" rx="3" fill="#7461ba"/><text x="282" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">债券</text><text x="282" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">契约本息权利</text><text x="282" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">发行人可能违约</text><path d="M472 184L488 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="490" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="2"/><rect x="490" y="101" width="7" height="166" rx="3" fill="#d06d4d"/><text x="507" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">ETF 份额</text><text x="507" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">一篮子底层资产</text><text x="507" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">仍可集中或亏损</text><path d="M697 184L713 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="715" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#b28a37" stroke-width="2"/><rect x="715" y="101" width="7" height="166" rx="3" fill="#b28a37"/><text x="732" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">期权</text><text x="732" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">条件性合约</text><text x="732" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">波动率和期限敏感</text><path d="M42 319H918" stroke="#c9d9d4" stroke-width="2"/><text x="46" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">资产名称不是固定风险等级：应检查具体条款和底层持仓。</text><text x="46" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">再比较流动性、杠杆、费用、税制和最坏损失。</text></svg>
