<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-24k desc-24k"><title id="title-24k">收盘后才产生的信号，不能按刚刚结束的收盘价成交</title><desc id="desc-24k">无可证实的收盘竞价下单机制时，默认下一可交易时段执行。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">收盘后才产生的信号，不能按刚刚结束的收盘价成交</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">无可证实的收盘竞价下单机制时，默认下一可交易时段执行。</text><path d="M68 235H890" stroke="#c7d8d2" stroke-width="3"/><path d="M130 217V254" stroke="#147f80" stroke-width="4"/><text x="130" y="176" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">t日收盘</text><text x="130" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">计算SMA信号</text><path d="M360 217V254" stroke="#7461ba" stroke-width="4"/><text x="360" y="176" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">t+1开盘</text><text x="360" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">可执行价格出现</text><path d="M590 217V254" stroke="#916c22" stroke-width="4"/><text x="590" y="176" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">交易回报</text><text x="590" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">按订单状态确认</text><path d="M820 217V254" stroke="#d06d4d" stroke-width="4"/><text x="820" y="176" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">t+1收盘</text><text x="820" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">按持仓标记净值</text><rect x="75" y="326" width="810" height="74" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="100" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">同日收盘信号 → 同日收盘成交，会造成前视偏差。</text></svg>