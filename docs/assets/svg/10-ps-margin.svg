<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">市销率与净利率隐含市盈率</title><desc id="fig-desc">市销率固定2倍，净利润率2%、5%、10%、20%对应PE100、40、20、10倍。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="38" y="44" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">同样 PS=2×：净利率越低，隐含PE可能越高</text><path d="M106 90L106 344" fill="none" stroke="#203035" stroke-width="2"/><path d="M106 344L887 344" fill="none" stroke="#203035" stroke-width="2"/><rect x="127" y="149" width="114" height="195" rx="10" fill="#f4e1d9" stroke="#c9d9d4" stroke-width="1.5"/><text x="182" y="132" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#d06d4d" text-anchor="middle">100×</text><text x="182" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">2%利润率</text><rect x="322" y="266" width="114" height="78" rx="10" fill="#f4e1d9" stroke="#c9d9d4" stroke-width="1.5"/><text x="377" y="249" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#d06d4d" text-anchor="middle">40×</text><text x="377" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">5%利润率</text><rect x="517" y="305" width="114" height="39" rx="10" fill="#f4e1d9" stroke="#c9d9d4" stroke-width="1.5"/><text x="572" y="288" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#d06d4d" text-anchor="middle">20×</text><text x="572" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">10%利润率</text><rect x="712" y="324.5" width="114" height="19.5" rx="10" fill="#cce9de" stroke="#c9d9d4" stroke-width="1.5"/><text x="767" y="307.5" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#147f80" text-anchor="middle">10×</text><text x="767" y="372" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#203035" text-anchor="middle">20%利润率</text><text x="38" y="423" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">同一口径且净利润为正：PE=PS/净利润率；图示是假设条件，不是实测行业数据。</text></svg>
