<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r18r d-r18r"><title id="t-r18r">反身性：预期会影响融资与经营，结果再反过来影响预期</title><desc id="d-r18r">这是索罗斯提出的解释框架；图示是一种可能的反馈链，不是所有市场阶段的普遍定律。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">反身性：预期会影响融资与经营，结果再反过来影响预期</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">这是索罗斯提出的解释框架；图示是一种可能的反馈链，不是所有市场阶段的普遍定律。</text><rect x="55" y="145" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="55" y="145" width="7" height="112" rx="4" fill="#916c22"/><text x="75" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#916c22">参与者预期</text><text x="75" y="206" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">增长、风险与估值</text><text x="75" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">融资意愿</text><path d="M250 200 L325 200" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="335" y="145" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="335" y="145" width="7" height="112" rx="4" fill="#147f80"/><text x="355" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">市场价格</text><text x="355" y="206" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">估值、股权成本</text><text x="355" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">抵押品价值</text><path d="M530 200 L605 200" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="615" y="145" width="290" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="615" y="145" width="7" height="112" rx="4" fill="#7461ba"/><text x="635" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">经营与融资条件</text><text x="635" y="206" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">扩产、并购、信用供给</text><text x="635" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">招聘、需求与现金流</text><path d="M760 260 C760 365 170 365 150 260" fill="none" stroke="#d06d4d" stroke-width="3" marker-end="url(#arr)"/><text x="470" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#d06d4d">结果可能强化原预期，也可能在融资收紧时反转</text><text x="480" y="410" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">反身性解释价格—基本面双向影响；实证研究仍需识别因果方向。</text></svg>