<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">反身性正反馈循环</title><desc id="d">股价上涨使融资与并购更容易，进而改善基本面，推动预期与估值上调，再进一步推高股价，形成自我强化的循环。</desc><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#7461ba"/></marker></defs><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">反身性：价格可以不只反映基本面，还会反过来改变它</text><rect x="360" y="82" width="240" height="56" rx="10" fill="#147f80"/><text x="480" y="117" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">股价上涨</text><rect x="640" y="202" width="240" height="56" rx="10" fill="#147f80"/><text x="760" y="237" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">融资与并购更易</text><rect x="360" y="322" width="240" height="56" rx="10" fill="#147f80"/><text x="480" y="357" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">基本面改善</text><rect x="80" y="202" width="240" height="56" rx="10" fill="#147f80"/><text x="200" y="237" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">预期与估值上调</text><path d="M600 120L672 200" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#arw)"/><path d="M760 258L520 330" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#arw)"/><path d="M360 350L288 260" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#arw)"/><path d="M200 202L440 132" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#arw)"/><text x="40" y="430" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：循环在上涨与下跌两个方向都可能自我强化，方向相同、机制对称；图中箭头表示因果环节，不代表固定时长。</text></svg>
