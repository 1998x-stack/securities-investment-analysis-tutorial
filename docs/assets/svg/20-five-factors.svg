<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r20 d-r20"><title id="t-r20">Fama–French五因子：五个可区分的收益组合，不是五个神奇指标</title><desc id="d-r20">市场因子、规模、价值、盈利与投资；动量通常作为额外因子扩展，而非FF五因子之一。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">Fama–French五因子：五个可区分的收益组合，不是五个神奇指标</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">市场因子、规模、价值、盈利与投资；动量通常作为额外因子扩展，而非FF五因子之一。</text><rect x="35" y="125" width="165" height="92" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="35" y="125" width="7" height="92" rx="4" fill="#147f80"/><text x="55" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">市场 MKT</text><text x="55" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">市场组合 − 无风险利率</text><rect x="225" y="125" width="215" height="92" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="225" y="125" width="7" height="92" rx="4" fill="#7461ba"/><text x="245" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">规模 SMB</text><text x="245" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">小市值组合 − 大市值组合</text><rect x="465" y="125" width="215" height="92" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="465" y="125" width="7" height="92" rx="4" fill="#916c22"/><text x="485" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#916c22">价值 HML</text><text x="485" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">高账面市值比 − 低账面市值比</text><rect x="705" y="125" width="215" height="92" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="705" y="125" width="7" height="92" rx="4" fill="#d06d4d"/><text x="725" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">盈利 RMW</text><text x="725" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">高盈利 − 低盈利</text><rect x="225" y="255" width="215" height="92" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="225" y="255" width="7" height="92" rx="4" fill="#147f80"/><text x="245" y="288" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">投资 CMA</text><text x="245" y="316" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">保守投资 − 激进投资</text><rect x="465" y="255" width="215" height="92" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="465" y="255" width="7" height="92" rx="4" fill="#d06d4d"/><text x="485" y="288" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">动量 UMD</text><text x="485" y="316" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">额外扩展：赢家 − 输家</text><text x="705" y="286" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d06d4d">注意：UMD不是FF5</text><text x="480" y="410" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">每个因子都依赖样本、排序规则、再平衡与可交易性。</text></svg>