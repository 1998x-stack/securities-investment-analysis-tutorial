<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="s-title s-desc"><title id="s-title">资金流：发行与转让的区别</title><desc id="s-desc">一级市场使发行人获得融资；二级市场在持有人之间转让。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="420" rx="12" fill="#f3f7f5"/><text x="40" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">资金流：发行与转让的区别</text><rect x="40" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#147f80" stroke-width="2"/><rect x="40" y="101" width="7" height="166" rx="3" fill="#147f80"/><text x="57" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">发行人</text><text x="57" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">增发新股</text><text x="57" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">收到募集资金</text><path d="M322 184L338 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="340" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#7461ba" stroke-width="2"/><rect x="340" y="101" width="7" height="166" rx="3" fill="#7461ba"/><text x="357" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">投资者 A</text><text x="357" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">一级市场认购</text><text x="357" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">获得新的证券</text><path d="M622 184L638 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="640" y="101" width="280" height="166" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="2"/><rect x="640" y="101" width="7" height="166" rx="3" fill="#d06d4d"/><text x="657" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">投资者 B</text><text x="657" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">二级市场买入</text><text x="657" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">与 A 交换存量证券</text><path d="M42 319H918" stroke="#c9d9d4" stroke-width="2"/><text x="46" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">一级市场改变发行人的融资；二级市场通常不直接为其新增现金。</text><text x="46" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">实际市场还需要交易所、券商、登记结算机构与信息披露。</text></svg>
