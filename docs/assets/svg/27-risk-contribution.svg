<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">协方差决定组合风险贡献</title><desc id="desc">组合波动由权重和协方差共同决定；Euler风险贡献加总为组合波动，相关性会改变简单逆波动率权重。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<rect x="35" y="100" width="220" height="245" rx="13" fill="#f3f7f5" stroke="#147f80"/><text x="145" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">资产风险输入</text>
<text x="60" y="180" font-size="16" fill="#203035">股票：σ₁、w₁</text><text x="60" y="220" font-size="16" fill="#203035">债券：σ₂、w₂</text><text x="60" y="260" font-size="16" fill="#203035">黄金：σ₃、w₃</text><text x="60" y="315" font-size="14" fill="#53676d">含相关系数 ρᵢⱼ</text>
<path d="M255 220 L330 220" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="330" y="100" width="280" height="245" rx="13" fill="#eeeaf7" stroke="#7461ba"/><text x="470" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">协方差矩阵 Σ</text><text x="470" y="185" text-anchor="middle" font-size="19" fill="#203035">Σᵢⱼ = ρᵢⱼ σᵢ σⱼ</text><text x="470" y="235" text-anchor="middle" font-size="18" fill="#203035">σₚ = √(wᵀΣw)</text><text x="470" y="285" text-anchor="middle" font-size="15" fill="#53676d">边际风险 × 组合权重</text>
<path d="M610 220 L685 220" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="685" y="100" width="240" height="245" rx="13" fill="#f9e9e2" stroke="#d06d4d"/><text x="805" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">风险贡献</text><text x="805" y="190" text-anchor="middle" font-size="18" fill="#203035">RCᵢ = wᵢ(Σw)ᵢ/σₚ</text><text x="805" y="245" text-anchor="middle" font-size="17" fill="#203035">Σ RCᵢ = σₚ</text><text x="805" y="300" text-anchor="middle" font-size="14" fill="#53676d">可为负值（对冲贡献）</text>
<text x="480" y="405" text-anchor="middle" font-size="14" fill="#53676d">逆波动率只是零相关或简化情形，不等于一般风险平价解</text></svg>