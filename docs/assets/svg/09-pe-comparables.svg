<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">相同 PE，不意味着相同盈利质量与风险</title><desc id="fig-desc">三家假设企业PE均15倍，成长、盈利、风险完全不同。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="39" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">相同 PE，不意味着相同盈利质量与风险</text><rect x="40" y="110" width="280.6666666666667" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="110" width="6" height="166" rx="3" fill="#147f80"/><text x="56" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">企业 A</text><text x="56" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">PE 15×</text><text x="56" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">净利率15%</text><path d="M322.6666666666667 191L336.6666666666667 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="339.6666666666667" y="110" width="280.6666666666667" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="339.6666666666667" y="110" width="6" height="166" rx="3" fill="#7461ba"/><text x="355.6666666666667" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">企业 B</text><text x="355.6666666666667" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">PE 15×</text><text x="355.6666666666667" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">净利率4%</text><path d="M622.3333333333334 191L636.3333333333334 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="639.3333333333334" y="110" width="280.6666666666667" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="639.3333333333334" y="110" width="6" height="166" rx="3" fill="#d06d4d"/><text x="655.3333333333334" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">企业 C</text><text x="655.3333333333334" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">PE 15×</text><text x="655.3333333333334" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">净利率8%</text><path d="M40 316L920 316" fill="none" stroke="#c9d9d4" stroke-width="2"/><text x="43" y="354" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">A增长4%、B增长20%、C增长0%（假设）；三者并非可直接互换的可比公司。</text><text x="43" y="391" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">比较时需核对 EPS口径、财务杠杆、现金流、行业周期、资本开支和增长可信度。</text></svg>
