<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r17 d-r17"><title id="t-r17">羊群反馈可以放大趋势，也会在资金反向时加速逆转</title><desc id="d-r17">注意力与资金流影响价格，价格又影响媒体叙事、风险偏好与后续资金流。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">羊群反馈可以放大趋势，也会在资金反向时加速逆转</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">注意力与资金流影响价格，价格又影响媒体叙事、风险偏好与后续资金流。</text><rect x="65" y="145" width="190" height="100" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="65" y="145" width="7" height="100" rx="4" fill="#916c22"/><text x="85" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#916c22">共同叙事</text><text x="85" y="206" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">新闻、社交信号</text><text x="85" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">注意力集中</text><path d="M260 195 L330 195" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="340" y="145" width="190" height="100" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="340" y="145" width="7" height="100" rx="4" fill="#147f80"/><text x="360" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">资金流入</text><text x="360" y="206" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">买盘增强</text><text x="360" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">成交与估值上升</text><path d="M535 195 L605 195" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="615" y="145" width="280" height="100" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="615" y="145" width="7" height="100" rx="4" fill="#7461ba"/><text x="635" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">价格与反馈</text><text x="635" y="206" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">账面收益、抵押品价值</text><text x="635" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">可见度与乐观预期上升</text><path d="M755 255 C755 355 210 355 160 255" fill="none" stroke="#d06d4d" stroke-width="3" marker-end="url(#arr)"/><text x="480" y="330" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#d06d4d">正反馈循环；反向资金流可能形成负反馈</text><text x="480" y="405" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">价格不是基本面的被动镜像，但反馈机制并非时时主导市场。</text></svg>