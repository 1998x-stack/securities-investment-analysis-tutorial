<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r19 d-r19"><title id="t-r19">量化选股的核心是时间一致的数据到可交易组合的完整链条</title><desc id="d-r19">原始数据、可用时间、信号计算、组合约束、交易成本和绩效归因必须逐环可复现。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">量化选股的核心是时间一致的数据到可交易组合的完整链条</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">原始数据、可用时间、信号计算、组合约束、交易成本和绩效归因必须逐环可复现。</text><rect x="38" y="140" width="165" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="38" y="140" width="7" height="112" rx="4" fill="#147f80"/><text x="58" y="173" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">数据快照</text><text x="58" y="201" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">财报与行情</text><text x="58" y="223" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">历史成分股</text><path d="M206 195 L232 195" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="240" y="140" width="165" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="240" y="140" width="7" height="112" rx="4" fill="#7461ba"/><text x="260" y="173" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">特征工程</text><text x="260" y="201" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">滞后、清洗</text><text x="260" y="223" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">缺失与异常</text><path d="M408 195 L434 195" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="442" y="140" width="165" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="442" y="140" width="7" height="112" rx="4" fill="#916c22"/><text x="462" y="173" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#916c22">信号评分</text><text x="462" y="201" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">排序、标准化</text><text x="462" y="223" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">行业中性</text><path d="M610 195 L636 195" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="644" y="140" width="130" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="644" y="140" width="7" height="112" rx="4" fill="#d06d4d"/><text x="664" y="173" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">组合构建</text><text x="664" y="201" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">权重与限额</text><text x="664" y="223" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">换手约束</text><path d="M777 195 L803 195" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="810" y="140" width="115" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="810" y="140" width="7" height="112" rx="4" fill="#147f80"/><text x="830" y="173" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">执行复盘</text><text x="830" y="201" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">滑点</text><text x="830" y="223" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">归因</text><rect x="38" y="300" width="887" height="80" rx="10" fill="#fff" stroke="#c7d8d2"/><text x="58" y="330" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#203035">每个环节记录版本、时间戳、参数、样本和失败案例。</text><text x="58" y="358" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">回测的策略收益必须来自当时可用的数据与当时可执行的订单。</text></svg>