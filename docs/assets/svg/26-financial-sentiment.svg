<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">金融文本情绪分类与可解释聚合</title><desc id="desc">句子先经过领域语言模型得到正面中性负面概率，再形成单条分数；之后按置信度、相关性和时效性聚合。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<text x="38" y="42" font-size="15" fill="#53676d">分类任务：这段文字表达什么语气？它并不直接回答股票未来涨跌。</text>
<rect x="35" y="105" width="170" height="105" rx="13" fill="#f7f3e9" stroke="#53676d" stroke-opacity=".35"/><text x="120" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">原始句子</text><text x="120" y="166" text-anchor="middle" font-size="15" fill="#53676d">主体 / 事件 / 否定词</text>
<path d="M205 157 L245 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="245" y="105" width="180" height="105" rx="13" fill="#e8f2ef" stroke="#53676d" stroke-opacity=".35"/><text x="335" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">金融编码器</text><text x="335" y="166" text-anchor="middle" font-size="15" fill="#53676d">上下文与领域词义</text>
<path d="M425 157 L465 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="465" y="105" width="155" height="105" rx="13" fill="#eeeaf7" stroke="#53676d" stroke-opacity=".35"/><text x="542.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">分类层</text><text x="542.5" y="166" text-anchor="middle" font-size="15" fill="#53676d">Softmax</text>
<path d="M620 157 H660 M660 105 V220" stroke="#147f80" stroke-width="3" fill="none"/>
<path d="M660 105 H690 M660 157 H690 M660 209 H690" stroke="#147f80" stroke-width="3"/>
<rect x="690" y="78" width="225" height="55" rx="9" fill="#e8f2ef"/><text x="802" y="112" text-anchor="middle" font-size="17" fill="#203035">p(正面)</text>
<rect x="690" y="145" width="225" height="55" rx="9" fill="#f3f7f5"/><text x="802" y="179" text-anchor="middle" font-size="17" fill="#203035">p(中性)</text>
<rect x="690" y="212" width="225" height="55" rx="9" fill="#f9e9e2"/><text x="802" y="246" text-anchor="middle" font-size="17" fill="#203035">p(负面)</text>
<rect x="190" y="290" width="580" height="78" rx="12" fill="#f3f7f5" stroke="#147f80" stroke-opacity=".5"/>
<text x="480" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">单条情绪分数 = p(正面) − p(负面)</text>
<text x="480" y="348" text-anchor="middle" font-size="15" fill="#53676d">聚合时还要处理置信度、重复新闻、发布时间和公司相关性</text>
<text x="38" y="410" font-size="14" fill="#d06d4d">英语 FinBERT 的训练域不等于中文公告；必须用目标语言和目标市场重新验证</text></svg>