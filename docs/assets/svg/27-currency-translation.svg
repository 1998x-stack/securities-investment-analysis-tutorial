<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">海外资产收益如何换算为本币收益</title><desc id="desc">外币资产本币收益由资产本币价格变化与外币相对本币变化乘积决定；对冲减少汇率敞口但有成本和基差。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<rect x="30" y="110" width="210" height="125" rx="13" fill="#e8f2ef"/><text x="135" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">外币资产</text><text x="135" y="184" text-anchor="middle" font-size="16" fill="#53676d">本币计价前收益 Rₐ</text>
<path d="M240 172 L310 172" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="310" y="95" width="320" height="155" rx="13" fill="#eeeaf7"/><text x="470" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">汇率换算</text><text x="470" y="178" text-anchor="middle" font-size="19" fill="#203035">(1 + Rₐ)(1 + Rfx) − 1</text><text x="470" y="213" text-anchor="middle" font-size="14" fill="#53676d">Rfx：一单位外币的本币价值变化</text>
<path d="M630 172 L700 172" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="700" y="110" width="230" height="125" rx="13" fill="#e8f2ef"/><text x="815" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">本币收益</text><text x="815" y="184" text-anchor="middle" font-size="16" fill="#53676d">组合实际回报</text>
<path d="M470 250 V300" stroke="#d06d4d" stroke-width="3" marker-end="url(#coral)"/>
<rect x="250" y="300" width="440" height="88" rx="13" fill="#f9e9e2" stroke="#d06d4d"/><text x="470" y="334" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">远期 / 期货 / 期权对冲</text><text x="470" y="363" text-anchor="middle" font-size="15" fill="#53676d">调整目标汇率敞口，同时承担点差、展期、基差或期权费</text></svg>