<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">假突破的可观察时序</title><desc id="desc">虚构价格第七八天突破105后回落，说明突破信号可能失效，且阻力线应预先定义。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">突破要有事先定义的压力价与确认时点；信号有时失败</text><path d="M82 355L893 355" fill="none" stroke="#203035" stroke-width="2" /><path d="M82 190L895 190" fill="none" stroke="#d06d4d" stroke-width="2" stroke-dasharray="6 5"/><text x="890" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#d06d4d" text-anchor="end">事前设定阻力 105</text><path d="M121 311 L191 289 L261 256 L331 234 L401 212 L471 223 L541 179 L611 157 L681 212 L751 256 L821 278" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="121" cy="311" r="5" fill="#147f80"/><circle cx="191" cy="289" r="5" fill="#147f80"/><circle cx="261" cy="256" r="5" fill="#147f80"/><circle cx="331" cy="234" r="5" fill="#147f80"/><circle cx="401" cy="212" r="5" fill="#147f80"/><circle cx="471" cy="223" r="5" fill="#147f80"/><circle cx="541" cy="179" r="5" fill="#147f80"/><circle cx="611" cy="157" r="5" fill="#916c22"/><circle cx="681" cy="212" r="5" fill="#147f80"/><circle cx="751" cy="256" r="5" fill="#147f80"/><circle cx="821" cy="278" r="5" fill="#147f80"/><text x="620" y="91" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#916c22" text-anchor="start">第7–8天收盘越过</text><text x="620" y="117" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#d06d4d" text-anchor="start">随后跌回阻力线下</text><text x="42" y="418" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">以上是假设收盘序列；若阻力价根据未来走势回填，就构成前视偏差。</text></svg>
