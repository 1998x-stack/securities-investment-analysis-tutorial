<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">CAPM安全资产回报和系统性风险定价</title><desc id="d">当无风险收益3%、市场超额预期收益6%时，证券市场线随Beta线性变化，构造离散点提示模型偏差。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="43" font-size="22" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">CAPM证券市场线是一个可检验的均衡基准，不是确定回报预测</text><path d="M100 83L100 357" stroke="#203035" stroke-width="2" fill="none"/><path d="M100 357L884 357" stroke="#203035" stroke-width="2" fill="none"/><path d="M145 319L795 139" fill="none" stroke="#147f80" stroke-width="3.8"/><circle cx="171" cy="304.6" r="6" fill="#d06d4d"/><circle cx="249" cy="297.4" r="6" fill="#d06d4d"/><circle cx="327" cy="251.8" r="6" fill="#d06d4d"/><circle cx="405" cy="265" r="6" fill="#d06d4d"/><circle cx="457" cy="233.8" r="6" fill="#d06d4d"/><circle cx="535" cy="187" r="6" fill="#d06d4d"/><circle cx="639" cy="211" r="6" fill="#d06d4d"/><circle cx="717" cy="133" r="6" fill="#d06d4d"/><text x="40" y="94" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">收益率（%）</text><text x="783" y="388" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">Beta</text><text x="170" y="304" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#147f80">Rf=3%</text><text x="530" y="91" font-size="17" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#147f80">模型：E(R)=3%+β×6%</text><text x="39" y="425" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="400" text-anchor="start" fill="#53676d">散点均为构造数据。β 衡量相对市场协方差敏感度；模型有前提，真实收益可能偏离。</text></svg>