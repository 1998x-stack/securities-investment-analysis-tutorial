<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">宏观政策传导机制</title><desc id="fig-desc">货币政策通过收益率和风险溢价、实际需求与预期、汇率等多通道影响资产价格。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="37" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">政策作用于贴现率、现金流与风险偏好，不是单向股价指令</text><rect x="35" y="151" width="205" height="158" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="35" y="151" width="6" height="158" rx="3" fill="#7461ba"/><text x="51" y="183" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">央行与预期</text><text x="51" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">利率 / 流动性</text><text x="51" y="237" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">政策沟通</text><text x="51" y="261" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">市场原有预期</text><path d="M245 227L288 227" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="296" y="75" width="296" height="105" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="296" y="75" width="6" height="105" rx="3" fill="#147f80"/><text x="312" y="107" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">贴现率变化</text><text x="312" y="137" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">债券收益率与风险溢价</text><path d="M595 130L656 224" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="296" y="200" width="296" height="105" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="296" y="200" width="6" height="105" rx="3" fill="#7461ba"/><text x="312" y="232" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">基本面变化</text><text x="312" y="262" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">融资成本、需求、现金流</text><path d="M595 255L656 224" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="296" y="325" width="296" height="105" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="296" y="325" width="6" height="105" rx="3" fill="#d06d4d"/><text x="312" y="357" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">汇率与风险</text><text x="312" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">国际资本流动、信心</text><path d="M595 380L656 224" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="668" y="149" width="252" height="155" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="668" y="149" width="6" height="155" rx="3" fill="#147f80"/><text x="684" y="181" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">资产价格的合力</text><text x="684" y="211" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">不同通道可能相互抵消</text><text x="684" y="235" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">降息伴随悲观盈利预期时</text><text x="684" y="259" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股价未必上涨</text><text x="40" y="430" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">政策冲击与政策公告不同：必须识别市场“预期之外”的变化。</text></svg>
