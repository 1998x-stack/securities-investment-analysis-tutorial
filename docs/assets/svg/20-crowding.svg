<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r20c d-r20c"><title id="t-r20c">拥挤交易：相似持仓与资金流会改变退出时的市场深度</title><desc id="d-r20c">拥挤度是多指标代理；持仓集中、估值分化、换手和融资成本不能单独证明即将反转。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">拥挤交易：相似持仓与资金流会改变退出时的市场深度</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">拥挤度是多指标代理；持仓集中、估值分化、换手和融资成本不能单独证明即将反转。</text><rect x="55" y="135" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="55" y="135" width="7" height="112" rx="4" fill="#147f80"/><text x="75" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">因子表现走强</text><text x="75" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">历史收益吸引资金</text><text x="75" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">研究与产品扩张</text><path d="M250 190 L325 190" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="335" y="135" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="335" y="135" width="7" height="112" rx="4" fill="#7461ba"/><text x="355" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">持仓趋同</text><text x="355" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">重叠持仓上升</text><text x="355" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">交易方向集中</text><path d="M530 190 L605 190" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="615" y="135" width="290" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="615" y="135" width="7" height="112" rx="4" fill="#d06d4d"/><text x="635" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">退出容量受限</text><text x="635" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">流动性变薄、冲击成本升高</text><text x="635" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">赎回/去杠杆形成卖压</text><path d="M760 260 C760 355 170 355 150 260" fill="none" stroke="#916c22" stroke-width="3" marker-end="url(#arr)"/><text x="470" y="328" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#916c22">回撤会反过来削弱策略信心与资金供给</text><text x="480" y="408" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">应监测重叠持仓、容量、换手、价差和压力退出成本。</text></svg>