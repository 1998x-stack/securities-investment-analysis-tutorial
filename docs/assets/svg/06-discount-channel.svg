<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">同一未来现金流：折现率越高，今天的现值越低</title><desc id="svgDesc">第10年支付100元，按不同折现率计算现值。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">同一未来现金流：折现率越高，今天的现值越低</text><text x="40" y="76" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">假定第10年一次性得到100元，中间不分红。</text><path d="M100,112 L860,112" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M100,171.5 L860,171.5" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M100,231 L860,231" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M100,290.5 L860,290.5" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M100,350 L860,350" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M100 112V350H860" stroke="#203035" stroke-width="2" fill="none"/><path d="M140,125.79999999999998 L310,184.58505632508994 L480,252.64485729209184 L650,302.77266273509673 L820,340" stroke="#147f80" stroke-width="4" fill="none"/><circle cx="140" cy="125.79999999999998" r="5" fill="#147f80"/><text x="140" y="370" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#203035" text-anchor="middle">3%</text><circle cx="310" cy="184.58505632508994" r="5" fill="#147f80"/><text x="310" y="370" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#203035" text-anchor="middle">5%</text><circle cx="480" cy="252.64485729209184" r="5" fill="#147f80"/><text x="480" y="370" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#203035" text-anchor="middle">8%</text><circle cx="650" cy="302.77266273509673" r="5" fill="#147f80"/><text x="650" y="370" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#203035" text-anchor="middle">11%</text><circle cx="820" cy="340" r="5" fill="#147f80"/><text x="820" y="370" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#203035" text-anchor="middle">14%</text><text x="630" y="90" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#147f80" text-anchor="start">路径 1</text><text x="39" y="419" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">该图隔离折现渠道，实际股价还取决于未来现金流及风险溢价的调整。</text></svg>
