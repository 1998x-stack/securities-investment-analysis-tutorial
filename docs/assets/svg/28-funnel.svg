<svg data-export="28-funnel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="f28b-t f28b-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="f28b-t" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">三层选股漏斗</title><desc id="f28b-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">全市场股票先经基本面硬门槛排除风险样本，再用技术面确认时点，最后用多因子打分排序，候选数量逐层收窄。</desc><rect width="720" height="320" rx="14" fill="#f3f7f5" style=";fill:rgb(243, 247, 245);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="36" font-size="18" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:18px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">三层漏斗：先排除，再确认，最后排序</text><g font-family="Arial,'Microsoft YaHei',sans-serif" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visib