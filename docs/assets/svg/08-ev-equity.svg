<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">企业价值不等于股权价值：对象和现金流必须一致</title><desc id="fig-desc">将经营企业价值通过债务及现金调整到股权价值，分子分母口径对应。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="39" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">企业价值不等于股权价值：对象和现金流必须一致</text><rect x="40" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="110" width="6" height="166" rx="3" fill="#147f80"/><text x="56" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">经营价值 EV</text><text x="56" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">1170.75 百万元</text><text x="56" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">FCFF按WACC贴现</text><path d="M247.75 191L261.75 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="264.75" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="264.75" y="110" width="6" height="166" rx="3" fill="#7461ba"/><text x="280.75" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">减有息债务</text><text x="280.75" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">−200 百万元</text><text x="280.75" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">债权人优先索取</text><path d="M472.5 191L486.5 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="489.5" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="489.5" y="110" width="6" height="166" rx="3" fill="#d06d4d"/><text x="505.5" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">加可调整现金</text><text x="505.5" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">+50 百万元</text><text x="505.5" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">未被重复计入EV</text><path d="M697.25 191L711.25 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="714.25" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="714.25" y="110" width="6" height="166" rx="3" fill="#b28a37"/><text x="730.25" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">股权价值</text><text x="730.25" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">1020.75 百万元</text><text x="730.25" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股数100百万股</text><path d="M40 316L920 316" fill="none" stroke="#c9d9d4" stroke-width="2"/><text x="43" y="354" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">每股参考价值 ≈ 10.21 元；此处忽略少数权益、优先股及其他复杂调整。</text><text x="43" y="391" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">并非交易建议，所有数字为同一个构造案例。</text></svg>
