<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">企业自由现金流 FCFF：从经营收益扣除再投资</title><desc id="svgDesc">FCFF等于税后息税前利润加折旧摊销减资本开支减营运资本增加。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">企业自由现金流 FCFF：从经营收益扣除再投资</text><rect x="40" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="40" y="104" width="7" height="180" rx="3" fill="#7461ba"/><text x="58" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">税后 EBIT</text><text x="58" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">+120 百万元</text><text x="58" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">经营收益</text><path d="M247,192 L262,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="265" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="265" y="104" width="7" height="180" rx="3" fill="#147f80"/><text x="283" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">+ D&amp;A</text><text x="283" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">+20 百万元</text><text x="283" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">非现金费用</text><path d="M472,192 L487,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="490" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="490" y="104" width="7" height="180" rx="3" fill="#d06d4d"/><text x="508" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">− CapEx</text><text x="508" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">−45 百万元</text><text x="508" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">资本开支</text><path d="M697,192 L712,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="715" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#a57c28" stroke-width="1.7"/><rect x="715" y="104" width="7" height="180" rx="3" fill="#a57c28"/><text x="733" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">− ΔNWC</text><text x="733" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">−15 百万元</text><text x="733" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">营运资本占用</text><path d="M38,334 L922,334" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="42" y="367" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">FCFF = 120 + 20 − 45 − 15 = 80 百万元。</text><text x="42" y="400" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">示例为非金融企业的简化、正常化自由现金流，不是公司实际数据。</text></svg>
