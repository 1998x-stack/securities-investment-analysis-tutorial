<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">FCFF：扣除维持经营与增长所需的再投资</title><desc id="fig-desc">构造税后营业利润120、折旧摊销30、资本支出35、营运资本增加15，FCFF100。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="39" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">FCFF：扣除维持经营与增长所需的再投资</text><rect x="40" y="110" width="160.8" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="110" width="6" height="166" rx="3" fill="#147f80"/><text x="56" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">EBIT×(1−T)</text><text x="56" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">120 百万元</text><text x="56" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">税后营业利润</text><path d="M202.8 191L216.8 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="219.8" y="110" width="160.8" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="219.8" y="110" width="6" height="166" rx="3" fill="#7461ba"/><text x="235.8" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">+ D&amp;A</text><text x="235.8" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">+30</text><text x="235.8" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">非现金折旧摊销</text><path d="M382.6 191L396.6 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="399.6" y="110" width="160.8" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="399.6" y="110" width="6" height="166" rx="3" fill="#d06d4d"/><text x="415.6" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">− CapEx</text><text x="415.6" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">−35</text><text x="415.6" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">投资支出</text><path d="M562.4000000000001 191L576.4000000000001 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="579.4000000000001" y="110" width="160.8" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="579.4000000000001" y="110" width="6" height="166" rx="3" fill="#b28a37"/><text x="595.4000000000001" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">− ΔNWC</text><text x="595.4000000000001" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">−15</text><text x="595.4000000000001" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">占用营运资本</text><path d="M742.2 191L756.2 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="759.2" y="110" width="160.8" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="759.2" y="110" width="6" height="166" rx="3" fill="#147f80"/><text x="775.2" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">FCFF</text><text x="775.2" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">100</text><text x="775.2" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">全体资本现金流</text><path d="M40 316L920 316" fill="none" stroke="#c9d9d4" stroke-width="2"/><text x="43" y="354" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">120 + 30 − 35 − 15 = 100 百万元；均为虚构数据。</text><text x="43" y="391" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">FCFF属于债权与股权资本提供者，折现时需要用对应的企业资本成本。</text></svg>
