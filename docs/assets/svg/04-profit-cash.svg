<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="s-title s-desc"><title id="s-title">净利润与现金流为何可能反向</title><desc id="s-desc">赊销赊购的简化案例中利润增加20但现金减少10。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="420" rx="12" fill="#f3f7f5"/><text x="40" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">净利润与现金流为何可能反向</text><rect x="40" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#147f80" stroke-width="2"/><rect x="40" y="101" width="7" height="166" rx="3" fill="#147f80"/><text x="57" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">收入 100 万</text><text x="57" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">赊销 40</text><text x="57" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">实际收款 60</text><path d="M247 184L263 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="265" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#7461ba" stroke-width="2"/><rect x="265" y="101" width="7" height="166" rx="3" fill="#7461ba"/><text x="282" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">费用 80 万</text><text x="282" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">尚欠款项 10</text><text x="282" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">实际付款 70</text><path d="M472 184L488 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="490" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="2"/><rect x="490" y="101" width="7" height="166" rx="3" fill="#d06d4d"/><text x="507" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">账面利润</text><text x="507" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">100 − 80</text><text x="507" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">利润 +20 万</text><path d="M697 184L713 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="715" y="101" width="205" height="166" rx="10" fill="#fff" stroke="#b28a37" stroke-width="2"/><rect x="715" y="101" width="7" height="166" rx="3" fill="#b28a37"/><text x="732" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">经营净现金</text><text x="732" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">收款 − 付款</text><text x="732" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">60 − 70 = −10 万</text><path d="M42 319H918" stroke="#c9d9d4" stroke-width="2"/><text x="46" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">两者相差 30 万，来自应收款增加40与应付款增加10。</text><text x="46" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">简化案例不含其他现金流调整与非现金费用。</text></svg>
