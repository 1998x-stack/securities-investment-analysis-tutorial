<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">增长与通胀冲击的宏观情景矩阵</title><desc id="desc">用增长和通胀相对预期的变化形成四种情景；每个象限只提示风险传导渠道，不规定唯一最优资产。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<text x="480" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">通胀变化（相对预期）</text>
<text x="24" y="230" transform="rotate(-90 24 230)" text-anchor="middle" font-size="18" font-weight="700" fill="#203035">增长变化（相对预期）</text>
<rect x="130" y="75" width="350" height="145" rx="12" fill="#f9e9e2" stroke="#d06d4d"/><text x="305" y="110" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">增长↑ · 通胀↑</text><text x="305" y="145" text-anchor="middle" font-size="16" fill="#53676d">需求 / 定价压力上升</text><text x="305" y="175" text-anchor="middle" font-size="15" fill="#53676d">实际利率、商品、期限溢价需分辨</text>
<rect x="490" y="75" width="350" height="145" rx="12" fill="#e8f2ef" stroke="#147f80"/><text x="665" y="110" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">增长↑ · 通胀↓</text><text x="665" y="145" text-anchor="middle" font-size="16" fill="#53676d">生产率 / 供给改善</text><text x="665" y="175" text-anchor="middle" font-size="15" fill="#53676d">盈利增长与实际利率可能同向变化</text>
<rect x="130" y="230" width="350" height="145" rx="12" fill="#f7f3e9" stroke="#916c22"/><text x="305" y="265" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">增长↓ · 通胀↑</text><text x="305" y="300" text-anchor="middle" font-size="16" fill="#53676d">供给冲击 / 滞胀风险</text><text x="305" y="330" text-anchor="middle" font-size="15" fill="#53676d">股票债券相关性可能同时上升</text>
<rect x="490" y="230" width="350" height="145" rx="12" fill="#eeeaf7" stroke="#7461ba"/><text x="665" y="265" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">增长↓ · 通胀↓</text><text x="665" y="300" text-anchor="middle" font-size="16" fill="#53676d">需求收缩 / 通缩压力</text><text x="665" y="330" text-anchor="middle" font-size="15" fill="#53676d">盈利、信用利差和政策空间共同作用</text>
<text x="480" y="418" text-anchor="middle" font-size="14" fill="#d06d4d">象限是情景框架，不是可直接交易的预测时钟</text></svg>