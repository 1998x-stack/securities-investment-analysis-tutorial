<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">K线OHLC与影线说明</title><desc id="desc">三根示例K线分别收高、收低与开收相同，展示上下影线和实体编码。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="44" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">四个成交价决定一根蜡烛：高 / 低 / 开 / 收</text><path d="M64 342L902 342" fill="none" stroke="#203035" stroke-width="2" /><path d="M203 122L203 302" fill="none" stroke="#203035" stroke-width="3" /><rect x="169" y="162" width="68" height="100" fill="#147f80" stroke="#203035" stroke-width="2"/><text x="203" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="middle">收高</text><text x="248" y="119" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">最高 112</text><path d="M492 112L492 332" fill="none" stroke="#203035" stroke-width="3" /><rect x="458" y="152" width="68" height="120" fill="#d06d4d" stroke="#203035" stroke-width="2"/><text x="492" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#d06d4d" text-anchor="middle">收低</text><text x="537" y="109" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">最高 113</text><path d="M778 132L778 292" fill="none" stroke="#203035" stroke-width="3" /><rect x="744" y="232" width="68" height="3" fill="#7461ba" stroke="#203035" stroke-width="2"/><text x="778" y="387" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#7461ba" text-anchor="middle">开收相同</text><text x="823" y="129" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">最高 111</text><text x="38" y="426" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">开盘至收盘变化与最高最低的影线不同；构造蜡烛不具备未来走势预测能力。</text></svg>
