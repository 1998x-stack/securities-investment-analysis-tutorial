<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r19w d-r19w"><title id="t-r19w">滚动样本外检验按时间向前推进，测试区间不能反哺参数</title><desc id="d-r19w">训练与验证可用于选择模型；最终测试区间保持隔离，随后进行纸面交易与实盘监控。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">滚动样本外检验按时间向前推进，测试区间不能反哺参数</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">训练与验证可用于选择模型；最终测试区间保持隔离，随后进行纸面交易与实盘监控。</text><rect x="55" y="135" width="190" height="110" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="55" y="135" width="7" height="110" rx="4" fill="#147f80"/><text x="75" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">训练窗口</text><text x="75" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">拟合参数</text><text x="75" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">研究假设</text><path d="M250 190 L300 190" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="310" y="135" width="190" height="110" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="310" y="135" width="7" height="110" rx="4" fill="#7461ba"/><text x="330" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">验证窗口</text><text x="330" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">选模型与阈值</text><text x="330" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">控制搜索规模</text><path d="M505 190 L555 190" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="565" y="135" width="155" height="110" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="565" y="135" width="7" height="110" rx="4" fill="#916c22"/><text x="585" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#916c22">最终测试</text><text x="585" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">一次性评估</text><text x="585" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">不再调参</text><path d="M725 190 L770 190" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="780" y="135" width="135" height="110" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="780" y="135" width="7" height="110" rx="4" fill="#d06d4d"/><text x="800" y="168" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">纸面 / 实盘</text><text x="800" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">成本监控</text><text x="800" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">漂移复核</text><path d="M55 290 H915" stroke="#c7d8d2" stroke-width="2"/><text x="55" y="325" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#53676d">时间向右推进 →</text><text x="55" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d06d4d">若根据测试结果再改参数，原测试集就不再是独立样本外。</text></svg>