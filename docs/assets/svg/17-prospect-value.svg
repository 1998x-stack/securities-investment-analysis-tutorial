<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r17 d-r17"><title id="t-r17">前景理论的价值函数围绕参考点，而不是总财富零点</title><desc id="d-r17">示意价值函数在收益区间边际敏感度递减，在损失区间更陡；参数不是所有人的固定心理常数。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">前景理论的价值函数围绕参考点，而不是总财富零点</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">示意价值函数在收益区间边际敏感度递减，在损失区间更陡；参数不是所有人的固定心理常数。</text><path d="M85 245 H880 M480 385 V105" stroke="#53676d" stroke-width="2" fill="none"/><path d="M120 365 C250 330 360 275 480 245 C590 220 710 195 850 175" fill="none" stroke="#147f80" stroke-width="5"/><path d="M120 365 C260 330 360 275 480 245" fill="none" stroke="#d06d4d" stroke-width="5"/><path d="M480 245 C590 220 710 195 850 175" fill="none" stroke="#147f80" stroke-width="5"/><path d="M480 245 L480 385 M85 245 H880" stroke="#53676d" stroke-width="1.5" stroke-dasharray="5 6"/><text x="505" y="118" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#53676d">主观价值 v(x)</text><text x="850" y="220" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#147f80">收益：边际敏感度递减</text><text x="120" y="340" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#d06d4d">损失：通常更陡</text><text x="480" y="414" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#203035">参考点 x = 0</text><text x="105" y="225" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">损失</text><text x="850" y="225" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#53676d">收益</text></svg>