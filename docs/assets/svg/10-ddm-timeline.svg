<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Gordon模型：永续股利的价格来自现金流贴现</title><desc id="svgDesc">下一年股利D1为2元、k=8%、g=3%，稳态股利估值为40元每股。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">Gordon模型：永续股利的价格来自现金流贴现</text><rect x="40" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="40" y="104" width="7" height="180" rx="3" fill="#7461ba"/><text x="58" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">第1年</text><text x="58" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股利 2.00 元</text><text x="58" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">未来现金流</text><path d="M247,192 L262,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="265" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="265" y="104" width="7" height="180" rx="3" fill="#147f80"/><text x="283" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">第2年</text><text x="283" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股利 2.06 元</text><text x="283" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">假设增长3%</text><path d="M472,192 L487,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="490" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="490" y="104" width="7" height="180" rx="3" fill="#d06d4d"/><text x="508" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">第3年</text><text x="508" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股利 2.12 元</text><text x="508" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">假设增长3%</text><path d="M697,192 L712,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="715" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#a57c28" stroke-width="1.7"/><rect x="715" y="104" width="7" height="180" rx="3" fill="#a57c28"/><text x="733" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">以后每年</text><text x="733" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">继续增长3%</text><text x="733" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">必须可持续</text><path d="M38,334 L922,334" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="42" y="367" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">稳态模型 P0 = D1 / (k − g) = 40 元/股。</text><text x="42" y="400" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">g ≥ k 时普通Gordon公式无有限解；股利政策不稳定时模型不合适。</text></svg>
