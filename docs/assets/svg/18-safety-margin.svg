<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">安全边际：买入价低于内在价值估计</title><desc id="d">以估计的内在价值为参照，买入价设在内在价值的三分之二左右，二者之间的差额即为安全边际，用来吸收估值错误。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">安全边际不是精确估值，而是为估值错误留出的缓冲</text><path d="M160 380L700 380" stroke="#203035" stroke-width="2" fill="none"/><rect x="200" y="80" width="130" height="300" fill="#147f80" rx="6"/><text x="212" y="70" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#147f80">内在价值估计 V=100</text><rect x="400" y="180" width="130" height="200" fill="#d06d4d" rx="6"/><text x="392" y="170" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">买入价 ≈ 2/3 V = 66.7</text><path d="M200 100L700 100" stroke="#147f80" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path d="M600 200L660 200" stroke="#203035" stroke-width="2" fill="none"/><path d="M655 195L665 200L655 205" stroke="#203035" stroke-width="2" fill="none"/><text x="676" y="205" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">安全边际 ≈ V/3</text><text x="40" y="432" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：V 只是一个估计值，安全边际的宽度取决于估值的不确定性，而不是固定比例。</text></svg>
