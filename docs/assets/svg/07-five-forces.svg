<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">波特五力的利润作用方向</title><desc id="svgDesc">五力包含供应商、购买者、潜在进入者、替代品与行业竞争，各自影响行业盈利。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">五力框架：行业利润如何受到五个方向挤压</text><rect x="359" y="168" width="244" height="111" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="359" y="168" width="7" height="111" rx="3" fill="#d06d4d"/><text x="377" y="199" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">现有企业竞争</text><text x="377" y="230" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">价格战 / 差异化</text><text x="377" y="254" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">固定成本与退出壁垒</text><rect x="356" y="66" width="255" height="75" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="356" y="66" width="7" height="75" rx="3" fill="#7461ba"/><text x="374" y="97" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">潜在进入者</text><text x="374" y="128" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">进入成本 / 规模</text><rect x="40" y="172" width="247" height="84" rx="10" fill="#fff" stroke="#a57c28" stroke-width="1.7"/><rect x="40" y="172" width="7" height="84" rx="3" fill="#a57c28"/><text x="58" y="203" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">供应商议价</text><text x="58" y="234" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">成本传导 / 稀缺性</text><rect x="676" y="172" width="247" height="84" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="676" y="172" width="7" height="84" rx="3" fill="#147f80"/><text x="694" y="203" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">购买者议价</text><text x="694" y="234" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">集中度 / 替代空间</text><rect x="352" y="309" width="255" height="75" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="352" y="309" width="7" height="75" rx="3" fill="#d06d4d"/><text x="370" y="340" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">替代品威胁</text><text x="370" y="371" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">跨技术可替代性</text><path d="M480,143 L480,162" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><path d="M289,209 L350,209" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><path d="M673,209 L611,209" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><path d="M481,305 L481,289" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><text x="35" y="423" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">每一种力量作用于收入、成本、毛利或资本成本，不等同于股票涨跌。</text></svg>
