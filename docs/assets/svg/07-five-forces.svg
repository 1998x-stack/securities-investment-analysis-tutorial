<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">行业五力模型</title><desc id="fig-desc">行业竞争为中心，潜在进入者、替代品、供应商与客户共同改变长期盈利结构。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="39" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">竞争结构决定盈利“被谁分走”：五力不是选股评分</text><rect x="358" y="166" width="244" height="115" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="358" y="166" width="6" height="115" rx="3" fill="#d06d4d"/><text x="374" y="198" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">现有企业竞争</text><text x="374" y="228" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">产能 / 差异化 / 价格</text><rect x="40" y="89" width="239" height="104" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="89" width="6" height="104" rx="3" fill="#147f80"/><text x="56" y="121" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">潜在进入者</text><text x="56" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">进入壁垒与资本要求</text><path d="M266 146L350 209" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="681" y="89" width="239" height="104" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="681" y="89" width="6" height="104" rx="3" fill="#7461ba"/><text x="697" y="121" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">替代品</text><text x="697" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">替代技术与转换成本</text><path d="M681 146L611 209" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="306" width="239" height="104" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="306" width="6" height="104" rx="3" fill="#d06d4d"/><text x="56" y="338" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">供应商</text><text x="56" y="368" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">议价力与集中度</text><path d="M266 353L350 244" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="681" y="306" width="239" height="104" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="681" y="306" width="6" height="104" rx="3" fill="#b28a37"/><text x="697" y="338" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">客户</text><text x="697" y="368" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">议价力与替代选择</text><path d="M681 353L611 244" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><text x="355" y="325" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="start">分析对象：行业利润空间</text></svg>
