<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">高增长向稳定增长的渐进路径</title><desc id="desc">一条从40%逐期下降至5%的增长率假设，避免将短期高增长永久延伸。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">增长率随竞争和渗透率提高逐步衰减，而不是永续40%</text><path d="M94 89L94 348" fill="none" stroke="#203035" stroke-width="2" /><path d="M94 348L884 348" fill="none" stroke="#203035" stroke-width="2" /><path d="M94 347L882 347" fill="none" stroke="#c2d6cf" stroke-width="1" stroke-dasharray="4 5"/><text x="81" y="352" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">0%</text><path d="M94 289L882 289" fill="none" stroke="#c2d6cf" stroke-width="1" stroke-dasharray="4 5"/><text x="81" y="294" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">10%</text><path d="M94 231L882 231" fill="none" stroke="#c2d6cf" stroke-width="1" stroke-dasharray="4 5"/><text x="81" y="236" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">20%</text><path d="M94 173L882 173" fill="none" stroke="#c2d6cf" stroke-width="1" stroke-dasharray="4 5"/><text x="81" y="178" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">30%</text><path d="M94 115L882 115" fill="none" stroke="#c2d6cf" stroke-width="1" stroke-dasharray="4 5"/><text x="81" y="120" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">40%</text><path d="M130 115 L210 138.20000000000002 L290 173 L370 207.8 L450 242.60000000000002 L530 265.8 L610 283.2 L690 300.6 L770 312.2 L850 318" fill="none" stroke="#147f80" stroke-width="4"/><circle cx="130" cy="115" r="5.5" fill="#147f80"/><text x="130" y="100" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">40%</text><circle cx="210" cy="138.20000000000002" r="5.5" fill="#147f80"/><text x="210" y="123.20000000000002" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">36%</text><circle cx="290" cy="173" r="5.5" fill="#147f80"/><text x="290" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">30%</text><circle cx="370" cy="207.8" r="5.5" fill="#147f80"/><text x="370" y="192.8" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">24%</text><circle cx="450" cy="242.60000000000002" r="5.5" fill="#147f80"/><text x="450" y="227.60000000000002" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">18%</text><circle cx="530" cy="265.8" r="5.5" fill="#147f80"/><text x="530" y="250.8" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">14%</text><circle cx="610" cy="283.2" r="5.5" fill="#147f80"/><text x="610" y="268.2" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">11%</text><circle cx="690" cy="300.6" r="5.5" fill="#147f80"/><text x="690" y="285.6" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">8%</text><circle cx="770" cy="312.2" r="5.5" fill="#147f80"/><text x="770" y="297.2" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">6%</text><circle cx="850" cy="318" r="5.5" fill="#147f80"/><text x="850" y="303" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#147f80" text-anchor="middle">5%</text><text x="55" y="394" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#7461ba" text-anchor="start">高增长</text><text x="440" y="394" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#d06d4d" text-anchor="start">增速放缓</text><text x="765" y="394" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#916c22" text-anchor="start">稳态</text><text x="40" y="425" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">纯构造路径。投资者必须解释增长期限、资本投入和稳定期合理性。</text></svg>
