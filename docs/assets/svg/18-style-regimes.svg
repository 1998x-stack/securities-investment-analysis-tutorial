<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r18m d-r18m"><title id="t-r18m">风格表现随环境变化：用情景矩阵思考，不把历史周期当预测</title><desc id="d-r18m">下表是方向性的教学假设，不是历史回测；不同公司与市场周期会有显著差异。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">风格表现随环境变化：用情景矩阵思考，不把历史周期当预测</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">下表是方向性的教学假设，不是历史回测；不同公司与市场周期会有显著差异。</text><text x="80" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#53676d">情景</text><text x="365" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">价值</text><text x="575" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#7461ba">成长</text><text x="785" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#d06d4d">动量</text><rect x="55" y="155" width="850" height="60" rx="8" fill="#edf3f0" stroke="#c7d8d2"/><text x="75" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#203035">利率上行 / 折现率抬升</text><text x="365" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#147f80">相对估值可能受益</text><text x="575" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7461ba">远期现金流折现压力</text><text x="785" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#d06d4d">趋势仍取决于价格路径</text><rect x="55" y="227" width="850" height="60" rx="8" fill="#fff" stroke="#c7d8d2"/><text x="75" y="263" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#203035">盈利扩散 / 需求改善</text><text x="365" y="263" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#147f80">取决于估值起点</text><text x="575" y="263" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7461ba">盈利兑现更重要</text><text x="785" y="263" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#d06d4d">强势股可能延续</text><rect x="55" y="299" width="850" height="60" rx="8" fill="#edf3f0" stroke="#c7d8d2"/><text x="75" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#203035">急速反转 / 流动性冲击</text><text x="365" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#147f80">价值陷阱可能加深</text><text x="575" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7461ba">高久期资产波动</text><text x="785" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#d06d4d">动量策略可能遭遇崩跌</text></svg>