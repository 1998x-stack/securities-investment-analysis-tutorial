<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-22c desc-22c"><title id="title-22c">行业景气的四类状态：描述变量，不预测时钟</title><desc id="desc-22c">订单、产能、利润、估值可能不同步；各行业的阶段长度不同。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">行业景气的四类状态：描述变量，不预测时钟</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">订单、产能、利润、估值可能不同步；各行业的阶段长度不同。</text><rect x="40" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="40" y="140" width="8" height="150" rx="3" fill="#147f80"/><text x="59" y="172" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">预期筑底</text><text x="59" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">库存与订单边际转变</text><text x="59" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">盈利可能尚未兑现</text><path d="M243.25 213L261.25 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="266.25" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="266.25" y="140" width="8" height="150" rx="3" fill="#7461ba"/><text x="285.25" y="172" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">复苏验证</text><text x="285.25" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">订单/价格改善</text><text x="285.25" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">业绩开始上修</text><path d="M469.5 213L487.5 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="492.5" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="492.5" y="140" width="8" height="150" rx="3" fill="#916c22"/><text x="511.5" y="172" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">扩张兑现</text><text x="511.5" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">产能利用率提高</text><text x="511.5" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">现金流与投入改善</text><path d="M695.75 213L713.75 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="718.75" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="718.75" y="140" width="8" height="150" rx="3" fill="#d06d4d"/><text x="737.75" y="172" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">降温调整</text><text x="737.75" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">订单增长回落</text><text x="737.75" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">估值和流动性承压</text><rect x="50" y="328" width="860" height="66" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="75" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">把领先指标、同步指标、滞后指标分开；不代表可确定轮动。</text></svg>