<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">收益分布的VaR分位线与CVaR尾区</title><desc id="d">横轴为以标准差表示的合成日收益，5%分位处的竖线把左尾切出；珊瑚色阴影表示该尾区的平均损失CVaR，大于VaR本身的绝对幅度。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">VaR只切出分位线，CVaR才回答线以外平均亏多少</text><path d="M120 380 L120.0 379.9 L148.0 379.7 L175.9 379.3 L203.9 378.1 L231.9 375.3 L259.8 369.8 L287.8 359.4 L315.8 341.9 L343.7 315.4 L344 380 Z" fill="#d06d4d" fill-opacity="0.30"/><path d="M120.0 379.9 L143.8 379.8 L167.5 379.5 L191.2 378.7 L215.0 377.2 L238.8 374.3 L262.5 369.0 L286.2 360.1 L310.0 346.2 L333.8 325.9 L357.5 298.8 L381.2 265.5 L405.0 228.4 L428.8 191.3 L452.5 159.4 L476.2 137.7 L500.0 130.0 L523.8 137.7 L547.5 159.4 L571.2 191.3 L595.0 228.4 L618.8 265.5 L642.5 298.8 L666.2 325.9 L690.0 346.2 L713.8 360.1 L737.5 369.0 L761.2 374.3 L785.0 377.2 L808.8 378.7 L832.5 379.5 L856.2 379.8 L880.0 379.9" fill="none" stroke="#147f80" stroke-width="3"/><path d="M120 380L880 380" stroke="#203035" stroke-width="2" fill="none"/><path d="M344 380L344 316" stroke="#d06d4d" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/><text x="352" y="303" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">5%分位 VaR ≈ −1.645σ</text><text x="150" y="330" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#a3402a">CVaR：尾区平均损失</text><text x="126" y="404" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">−4σ</text><text x="492" y="404" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">0</text><text x="852" y="404" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">+4σ</text><text x="40" y="430" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：按标准正态密度绘制的合成分布，用于区分分位线与尾部均值，不代表任何真实资产收益。</text></svg>
