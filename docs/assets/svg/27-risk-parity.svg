<?xml version="1.0" encoding="UTF-8"?>
<svg data-export="27-risk-parity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="f27b-t f27b-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="f27b-t" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">风险平价下的资金权重与风险贡献</title><desc id="f27b-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">低波动资产获得更高的资金权重，但各资产的加权波动即风险贡献大体相等。</desc><rect width="760" height="250" rx="14" fill="#f3f7f5" style=";fill:rgb(243, 247, 245);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="36" font-size="18" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:18px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">资金权重不同，但风险贡献相等</text><g font-family="Arial,'Microsoft YaHei',sans-serif" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><text x="40" y="86" font-size="13" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">股票 σ=20%</text><rect x="200" y="70" width="120" height="22" rx="4" fill="#d06d4d" style=";fill:rgb(208, 109, 77);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="330" y="87" font-size="12" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">权重≈15.8%</text><text x="40" y="126" font-size="13" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">债券 σ=5%</text><rect x="200" y="110" width="480" height="22" rx="4" fill="#147f80" style=";fill:rgb(20, 127, 128);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="690" y="127" font-size="12" text-anchor="end" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:end;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">权重≈63.2%</text><text x="40" y="166" font-size="13" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">黄金 σ=15%</text><rect x="200" y="150" width="160" height="22" rx="4" fill="#7461ba" style=";fill:rgb(116, 97, 186);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="370" y="167" font-size="12" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">权重≈21.0%</text><text x="200" y="205" font-size="13" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">三者风险贡献（w×σ）均≈3.16%</text><text x="40" y="238" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">教学示意：忽略相关性的逆波动率解；含相关性时需用风险预算求解。</text></g></svg>
