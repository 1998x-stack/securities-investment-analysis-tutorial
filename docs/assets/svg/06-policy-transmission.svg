<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">宏观政策通过多条机制影响股票价格</title><desc id="svgDesc">政策变化通过利率、信贷与企业经营同时改变现金流和贴现率。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">宏观政策通过多条机制影响股票价格</text><rect x="40" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="40" y="104" width="7" height="180" rx="3" fill="#7461ba"/><text x="58" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">政策冲击</text><text x="58" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">货币与财政工具</text><text x="58" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">政策预期变化</text><path d="M247,192 L262,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="265" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="265" y="104" width="7" height="180" rx="3" fill="#147f80"/><text x="283" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">金融条件</text><text x="283" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">利率 / 信用利差</text><text x="283" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">融资约束变化</text><path d="M472,192 L487,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="490" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="490" y="104" width="7" height="180" rx="3" fill="#d06d4d"/><text x="508" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">企业经营</text><text x="508" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">需求、成本、现金流</text><text x="508" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">风险和增长变化</text><path d="M697,192 L712,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="715" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#a57c28" stroke-width="1.7"/><rect x="715" y="104" width="7" height="180" rx="3" fill="#a57c28"/><text x="733" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">证券价值</text><text x="733" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">现金流折现</text><text x="733" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">风险溢价的变化</text><path d="M38,334 L922,334" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="42" y="367" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">股价是多条渠道与市场预期的净结果，不能仅由政策利率方向推断。</text><text x="42" y="400" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">箭头表示传导链的教学简化；传导强度、反馈及政策时滞未画入。</text></svg>
