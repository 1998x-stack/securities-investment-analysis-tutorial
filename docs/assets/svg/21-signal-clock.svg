<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-21s desc-21s"><title id="title-21s">从会计期间到交易决策有不可省略的时间顺序</title><desc id="desc-21s">研究者不能提前使用财报、分析师修正及资金流统计的未来版本。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">从会计期间到交易决策有不可省略的时间顺序</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">研究者不能提前使用财报、分析师修正及资金流统计的未来版本。</text><path d="M68 235H890" stroke="#c7d8d2" stroke-width="3"/><path d="M130 217V254" stroke="#147f80" stroke-width="4"/><text x="130" y="176" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">财务期末</text><text x="130" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">所属期结束</text><path d="M360 217V254" stroke="#7461ba" stroke-width="4"/><text x="360" y="176" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">正式披露</text><text x="360" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">信息首次公开</text><path d="M590 217V254" stroke="#916c22" stroke-width="4"/><text x="590" y="176" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">数据入库</text><text x="590" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">供应商可用时刻</text><path d="M820 217V254" stroke="#d06d4d" stroke-width="4"/><text x="820" y="176" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">实际成交</text><text x="820" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">下一可交易时点</text><rect x="75" y="326" width="810" height="74" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="100" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">因子须记录 available_at，财务所属期不等于投资者知晓日期。</text></svg>