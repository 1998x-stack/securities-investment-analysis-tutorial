<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">基本面从客户证据开始，最后落到资本回报</title><desc id="desc">客户、收入、成本和自由现金流逐项核对，不靠管理层单方叙述</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">基本面从客户证据开始，最后落到资本回报</text><rect x="36" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="36" y="118" width="6" height="168" rx="3" fill="#147f80"/><text x="52" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">需求</text><text x="52" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">真实交付与订单</text><text x="52" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">合同取消率</text><path d="M246.25 200L260.25 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="262.25" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="262.25" y="118" width="6" height="168" rx="3" fill="#7461ba"/><text x="278.25" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">变现</text><text x="278.25" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">售价与客户留存</text><text x="278.25" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">销售退货条款</text><path d="M472.5 200L486.5 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="488.5" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="488.5" y="118" width="6" height="168" rx="3" fill="#d06d4d"/><text x="504.5" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">利润</text><text x="504.5" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">毛利与费用</text><text x="504.5" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">同口径持续性</text><path d="M698.75 200L712.75 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="714.75" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="714.75" y="118" width="6" height="168" rx="3" fill="#916c22"/><text x="730.75" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">现金</text><text x="730.75" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">应收、库存、CapEx</text><text x="730.75" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">资金占用情况</text><path d="M37 320L925 320" fill="none" stroke="#c2d6cf" stroke-width="2" /><text x="41" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">核查路径：客户需求 → 可确认收入 → 盈利质量 → 再投资后自由现金。</text><text x="41" y="412" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">结论必须注明证据日期、来源、管理层叙述与可独立验证事实的区别。</text></svg>
