<?xml version="1.0" encoding="UTF-8"?>
<svg data-export="25-gap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="f25a-t f25a-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="f25a-t" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">从回测信号到真实成交之间的摩擦层</title><desc id="f25a-d" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">信号生成与实际成交之间，依次叠加网络延迟、订单被拒、涨跌停、费率与除权等摩擦，每一层都可能改变最终收益。</desc><rect width="760" height="260" rx="14" fill="#f3f7f5" style=";fill:rgb(243, 247, 245);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="30" y="36" font-size="18" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:18px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">信号到成交之间，隔着一整层现实摩擦</text><g font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><rect x="30" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#147f80" stroke-width="2" style=";fill:rgb(255, 255, 255);stroke:rgb(20, 127, 128);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="90" y="140" font-size="13" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">策略信号</text><rect x="180" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#d06d4d" stroke-width="2" style=";fill:rgb(255, 255, 255);stroke:rgb(208, 109, 77);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="240" y="134" font-size="12" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">网络延迟</text><text x="240" y="154" font-size="12" text-anchor="middle" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">订单被拒</text><rect x="330" y="100" width="140" height="70" rx="10" fill="#ffffff" stroke="#d06d4d" stroke-width="2" style=";fill:rgb(255, 255, 255);stroke:rgb(208, 109, 77);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="400" y="134" font-size="12" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">涨跌停 / 停牌</text><text x="400" y="154" font-size="12" text-anchor="middle" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">买不到 / 卖不掉</text><rect x="500" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#7461ba" stroke-width="2" style=";fill:rgb(255, 255, 255);stroke:rgb(116, 97, 186);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="560" y="134" font-size="12" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">费率 / 滑点</text><text x="560" y="154" font-size="12" text-anchor="middle" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">成本叠加</text><text x="650" y="140" font-size="13" text-anchor="middle" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">真实成交</text><path d="M150 135L178 135" stroke="#203035" stroke-width="2" style=";fill:rgb(83, 103, 109);stroke:rgb(32, 48, 53);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M300 135L328 135" stroke="#203035" stroke-width="2" style=";fill:rgb(83, 103, 109);stroke:rgb(32, 48, 53);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M470 135L498 135" stroke="#203035" stroke-width="2" style=";fill:rgb(83, 103, 109);stroke:rgb(32, 48, 53);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M620 135L646 135" stroke="#203035" stroke-width="2" style=";fill:rgb(83, 103, 109);stroke:rgb(32, 48, 53);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="30" y="218" font-size="12" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">每一层都能单独改变结果；把它们逐个建模，比给回测结果“打个折”更可靠。</text></g></svg>
