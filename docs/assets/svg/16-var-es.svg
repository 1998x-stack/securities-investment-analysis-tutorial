<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r16ve d-r16ve"><title id="t-r16ve">VaR给出分位点，ES继续问越过分位点后平均损失多少</title><desc id="d-r16ve">横轴是损失从小到大；右侧阴影尾部表示超过95% VaR阈值的损失区域。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">VaR给出分位点，ES继续问越过分位点后平均损失多少</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">横轴是损失从小到大；右侧阴影尾部表示超过95% VaR阈值的损失区域。</text><path d="M100 345 H875" stroke="#53676d" stroke-width="2"/><path d="M100 345 V112" stroke="#53676d" stroke-width="2"/><rect x="120" y="321" width="31" height="24" fill="#147f80" opacity="0.72"/><rect x="167" y="300" width="31" height="45" fill="#147f80" opacity="0.72"/><rect x="214" y="271" width="31" height="74" fill="#147f80" opacity="0.72"/><rect x="261" y="236" width="31" height="109" fill="#147f80" opacity="0.72"/><rect x="308" y="201" width="31" height="144" fill="#147f80" opacity="0.72"/><rect x="355" y="175" width="31" height="170" fill="#147f80" opacity="0.72"/><rect x="402" y="165" width="31" height="180" fill="#147f80" opacity="0.72"/><rect x="449" y="175" width="31" height="170" fill="#147f80" opacity="0.72"/><rect x="496" y="201" width="31" height="144" fill="#147f80" opacity="0.72"/><rect x="543" y="236" width="31" height="109" fill="#147f80" opacity="0.72"/><rect x="590" y="271" width="31" height="74" fill="#d06d4d" opacity="0.88"/><rect x="637" y="300" width="31" height="45" fill="#d06d4d" opacity="0.88"/><rect x="684" y="321" width="31" height="24" fill="#d06d4d" opacity="0.88"/><rect x="731" y="333" width="31" height="12" fill="#d06d4d" opacity="0.88"/><rect x="778" y="340" width="31" h