<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">PEG单位与负增长边界</title><desc id="fig-desc">市盈率20对应增长20%、10%、0%及负增长时PEG数值或适用性不同。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="40" y="44" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#203035" text-anchor="start">PEG的增长率分母按“百分数数字”使用，并非小数直接相除</text><rect x="40" y="93" width="878" height="68" rx="10" fill="#e9f4ef" stroke="#c9d9d4" stroke-width="1.5"/><text x="62" y="135" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">PE20×</text><text x="269" y="135" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">增长20%</text><text x="505" y="135" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">PEG=1.0</text><text x="744" y="135" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">20÷20</text><rect x="40" y="171" width="878" height="68" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><text x="62" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">PE20×</text><text x="269" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">增长10%</text><text x="505" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">PEG=2.0</text><text x="744" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">20÷10</text><rect x="40" y="249" width="878" height="68" rx="10" fill="#e9f4ef" stroke="#c9d9d4" stroke-width="1.5"/><text x="62" y="291" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">PE20×</text><text x="269" y="291" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">增长0%</text><text x="505" y="291" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">不可计算</text><text x="744" y="291" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">除零</text><rect x="40" y="327" width="878" height="68" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><text x="62" y="369" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">PE20×</text><text x="269" y="369" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">增长−5%</text><text x="505" y="369" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">通常失去解释力</text><text x="744" y="369" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#203035" text-anchor="start">负增长</text><text x="41" y="429" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">PEG依赖预测期、盈利质量与增长稳定性；“PEG&lt;1必然低估”不是估值定律。</text></svg>
