<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">EV/EBITDA：企业价值的分子与经营收益分母</title><desc id="fig-desc">构造市值800、债务300、可扣除现金100、EBITDA125，得到EV1000与8倍。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="39" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">EV/EBITDA：企业价值的分子与经营收益分母</text><rect x="40" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="110" width="6" height="166" rx="3" fill="#147f80"/><text x="56" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">股权市值</text><text x="56" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">800 百万元</text><text x="56" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股东价值</text><path d="M247.75 191L261.75 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="264.75" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="264.75" y="110" width="6" height="166" rx="3" fill="#7461ba"/><text x="280.75" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">+ 有息债务</text><text x="280.75" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">+300 百万元</text><text x="280.75" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">债权人索取权</text><path d="M472.5 191L486.5 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="489.5" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="489.5" y="110" width="6" height="166" rx="3" fill="#d06d4d"/><text x="505.5" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">− 可扣现金</text><text x="505.5" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">−100 百万元</text><text x="505.5" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">避免重复计入</text><path d="M697.25 191L711.25 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="714.25" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="714.25" y="110" width="6" height="166" rx="3" fill="#b28a37"/><text x="730.25" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">EV / EBITDA</text><text x="730.25" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">1000 / 125</text><text x="730.25" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">= 8×</text><path d="M40 316L920 316" fill="none" stroke="#c9d9d4" stroke-width="2"/><text x="43" y="354" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">EV=800+300−100=1000；EV/EBITDA=1000/125=8×。</text><text x="43" y="391" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">真实企业需处理租赁、少数权益、优先股、经营现金需求和EBITDA口径。</text></svg>
