<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">企业价值和股权价值不能混为一谈</title><desc id="svgDesc">股权市值800、债务300、非经营现金100，企业价值1000。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">企业价值和股权价值不能混为一谈</text><rect x="40" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="40" y="104" width="7" height="180" rx="3" fill="#7461ba"/><text x="58" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">股权市值</text><text x="58" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">800 百万元</text><text x="58" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">普通股权价值</text><path d="M247,192 L262,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="265" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="265" y="104" width="7" height="180" rx="3" fill="#147f80"/><text x="283" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">+ 有息债务</text><text x="283" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">300 百万元</text><text x="283" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">优先及少数权益设0</text><path d="M472,192 L487,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="490" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="490" y="104" width="7" height="180" rx="3" fill="#d06d4d"/><text x="508" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">− 可用现金</text><text x="508" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">100 百万元</text><text x="508" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">假设非经营现金</text><path d="M697,192 L712,192" fill="none" stroke="#147f80" stroke-width="2.6" marker-end="url(#arr)"/><rect x="715" y="104" width="205" height="180" rx="10" fill="#fff" stroke="#a57c28" stroke-width="1.7"/><rect x="715" y="104" width="7" height="180" rx="3" fill="#a57c28"/><text x="733" y="135" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">企业价值</text><text x="733" y="166" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">1000 百万元</text><text x="733" y="190" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">与EBITDA匹配</text><path d="M38,334 L922,334" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="42" y="367" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">EV = 股权市值 + 有息债务 + 其他索取权 − 可用现金。</text><text x="42" y="400" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">计算必须核对企业租赁、少数股权、现金定义及金融企业特殊性。</text></svg>
