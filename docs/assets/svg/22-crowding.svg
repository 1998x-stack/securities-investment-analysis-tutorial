<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-22o desc-22o"><title id="title-22o">因子表现、资金流与拥挤可能形成退出冲击</title><desc id="desc-22o">重叠持仓和流动性压力比单一估值分位更重要。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">因子表现、资金流与拥挤可能形成退出冲击</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">重叠持仓和流动性压力比单一估值分位更重要。</text><rect x="40" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="40" y="140" width="8" height="150" rx="3" fill="#147f80"/><text x="59" y="172" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">过去表现好</text><text x="59" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">更多资金追逐策略</text><text x="59" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">收益吸引新持有人</text><path d="M243.25 213L261.25 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="266.25" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="266.25" y="140" width="8" height="150" rx="3" fill="#7461ba"/><text x="285.25" y="172" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">持仓趋同</text><text x="285.25" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">行业/个股暴露重叠</text><text x="285.25" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">交易方向趋于一致</text><path d="M469.5 213L487.5 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="492.5" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="492.5" y="140" width="8" height="150" rx="3" fill="#916c22"/><text x="511.5" y="172" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">流动性冲击</text><text x="511.5" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">同时调整持仓</text><text x="511.5" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">价差与冲击成本上升</text><path d="M695.75 213L713.75 213" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#a)"/><rect x="718.75" y="140" width="201.25" height="150" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="718.75" y="140" width="8" height="150" rx="3" fill="#d06d4d"/><text x="737.75" y="172" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">预先限额</text><text x="737.75" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">单行业与成交占比</text><text x="737.75" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">压力情景与告警</text><rect x="50" y="328" width="860" height="66" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="75" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">拥挤度不是反转时点预测；市场深度和资金来源同样重要。</text></svg>