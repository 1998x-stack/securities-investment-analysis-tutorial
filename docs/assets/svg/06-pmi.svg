<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">PMI扩散指数演示</title><desc id="fig-desc">虚构的PMI月度序列在50上方或下方波动，50是扩张与收缩分界线。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="37" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">PMI 的50分界指扩张/收缩，不是经济活动总量50%</text><path d="M108 105L108 344" fill="none" stroke="#203035" stroke-width="2"/><path d="M108 344L882 344" fill="none" stroke="#203035" stroke-width="2"/><path d="M108 344L880 344" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="96" y="349" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">47</text><path d="M108 305.8333333333333L880 305.8333333333333" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="96" y="310.8333333333333" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">48</text><path d="M108 267.6666666666667L880 267.6666666666667" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="96" y="272.6666666666667" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">49</text><path d="M108 229.5L880 229.5" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-dasharray="4 5"/><text x="96" y="234.5" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">50</text><path d="M108 191.33333333333334L880 191.33333333333334" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="96" y="196.33333333333334" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">51</text><path d="M108 153.16666666666666L880 153.16666666666666" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="96" y="158.16666666666666" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">52</text><path d="M108 115L880 115" fill="none" stroke="#c9d9d4" stroke-width="1" stroke-dasharray="4 5"/><text x="96" y="120" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="end">53</text><path d="M145 267.6666666666667 L282 210.41666666666666 L419 191.33333333333334 L556 286.75 L693 260.0333333333332 L830 218.05000000000013" stroke="#147f80" stroke-width="4" fill="none"/><circle cx="145" cy="267.6666666666667" r="6" fill="#d06d4d"/><text x="145" y="250.66666666666669" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#d06d4d" text-anchor="middle">49</text><text x="145" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="middle">月1</text><circle cx="282" cy="210.41666666666666" r="6" fill="#147f80"/><text x="282" y="193.41666666666666" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">50.5</text><text x="282" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="middle">月2</text><circle cx="419" cy="191.33333333333334" r="6" fill="#147f80"/><text x="419" y="174.33333333333334" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">51</text><text x="419" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="middle">月3</text><circle cx="556" cy="286.75" r="6" fill="#d06d4d"/><text x="556" y="269.75" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#d06d4d" text-anchor="middle">48.5</text><text x="556" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="middle">月4</text><circle cx="693" cy="260.0333333333332" r="6" fill="#d06d4d"/><text x="693" y="243.0333333333332" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#d06d4d" text-anchor="middle">49.2</text><text x="693" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="middle">月5</text><circle cx="830" cy="218.05000000000013" r="6" fill="#147f80"/><text x="830" y="201.05000000000013" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">50.3</text><text x="830" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="middle">月6</text><text x="42" y="412" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">六个月数据纯属虚构；49→50.5表示调查景气由收缩转扩张，不能推断产量变化1.5%。</text></svg>
