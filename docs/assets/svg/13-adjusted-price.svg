<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">拆股、送转与分红：原始K线价格不能直接当收益率</title><desc id="desc">假设一拆二后股数翻倍股价约减半，持有份额价值在拆分瞬间近似不变</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">拆股、送转与分红：原始K线价格不能直接当收益率</text><rect x="36" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="36" y="118" width="6" height="168" rx="3" fill="#147f80"/><text x="52" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">拆股前</text><text x="52" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">100股 × 100元</text><text x="52" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">总持有值10,000</text><path d="M246.25 200L260.25 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="262.25" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="262.25" y="118" width="6" height="168" rx="3" fill="#7461ba"/><text x="278.25" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">2拆1</text><text x="278.25" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">每股变成两股</text><text x="278.25" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">不是盈利损失</text><path d="M472.5 200L486.5 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="488.5" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="488.5" y="118" width="6" height="168" rx="3" fill="#d06d4d"/><text x="504.5" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">拆股后</text><text x="504.5" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">200股 × 50元</text><text x="504.5" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">理论值10,000</text><path d="M698.75 200L712.75 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="714.75" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="714.75" y="118" width="6" height="168" rx="3" fill="#916c22"/><text x="730.75" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">调整序列</text><text x="730.75" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">统一复权口径</text><text x="730.75" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">配合分红和配股</text><path d="M37 320L925 320" fill="none" stroke="#c2d6cf" stroke-width="2" /><text x="41" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">错误：看原始价格100→50就说持有人亏损50%。</text><text x="41" y="412" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">真实总收益还需处理现金分红、税费、配股、行权等公司行动。</text></svg>
