<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">从研究信号到组合与净收益的完整执行链</title><desc id="desc">研究信号在决策时点形成，经过组合约束后于下一可交易时点执行；费用、价差、滑点与风险归因进入结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<rect x="25" y="105" width="155" height="105" rx="13" fill="#e8f2ef" stroke="#53676d" stroke-opacity=".35"/><text x="102.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">PIT特征</text><text x="102.5" y="166" text-anchor="middle" font-size="15" fill="#53676d">截至时点可用</text>
<path d="M180 157 L205 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="205" y="105" width="145" height="105" rx="13" fill="#eeeaf7" stroke="#53676d" stroke-opacity=".35"/><text x="277.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">信号评分</text><text x="277.5" y="166" text-anchor="middle" font-size="15" fill="#53676d">方向 / 置信度</text>
<path d="M350 157 L375 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="375" y="105" width="155" height="105" rx="13" fill="#f7f3e9" stroke="#53676d" stroke-opacity=".35"/><text x="452.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">组合约束</text><text x="452.5" y="166" text-anchor="middle" font-size="15" fill="#53676d">单名 / 行业 / 换手</text>
<path d="M530 157 L555 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="555" y="105" width="145" height="105" rx="13" fill="#f9e9e2" stroke="#53676d" stroke-opacity=".35"/><text x="627.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">下一时点</text><text x="627.5" y="166" text-anchor="middle" font-size="15" fill="#53676d">订单与成交</text>
<path d="M700 157 L725 157" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="725" y="105" width="205" height="105" rx="13" fill="#e8f2ef" stroke="#53676d" stroke-opacity=".35"/><text x="827.5" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">净值与归因</text><text x="827.5" y="166" text-anchor="middle" font-size="15" fill="#53676d">成本 / 风险 / 基准</text>
<path d="M825 210 V285 H480 V230" fill="none" stroke="#d06d4d" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#coral)"/>
<rect x="260" y="285" width="440" height="76" rx="12" fill="#f3f7f5" stroke="#147f80"/><text x="480" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#203035">验证失败 → 返回研究假设</text><text x="480" y="342" text-anchor="middle" font-size="14" fill="#53676d">不通过门槛时不增加资金、不跳过审计</text>
</svg>