<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">市场情绪周期的五个阶段</title><desc id="d">情绪从恐慌起步，经怀疑、乐观上行至狂热顶点，再经否认回落至恐慌，形成循环；每个阶段标注了常见的投资者行为。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">情绪周期按固定顺序循环，但每个阶段的持续时长并不固定</text><path d="M120 380L880 380" stroke="#c7d8d2" stroke-width="2" fill="none"/><path d="M140 345 C166.7 332.5 245.0 296.7 300 270 C355.0 243.3 410.0 210.3 470 185 C530.0 159.7 605.0 111.3 660 118 C715.0 124.7 763.3 187.2 800 225 C836.7 262.8 866.7 325.0 880 345" fill="none" stroke="#147f80" stroke-width="3.5"/><circle cx="140" cy="345" r="6" fill="#d06d4d"/><text x="86" y="372" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">恐慌</text><circle cx="300" cy="270" r="6" fill="#7461ba"/><text x="270" y="258" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#7461ba">怀疑</text><circle cx="470" cy="185" r="6" fill="#147f80"/><text x="438" y="173" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#147f80">乐观</text><circle cx="660" cy="118" r="6" fill="#d06d4d"/><text x="628" y="106" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">狂热</text><circle cx="800" cy="225" r="6" fill="#7461ba"/><text x="790" y="212" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#7461ba">否认</text><text x="40" y="432" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：阶段名称与顺序用于组织观察，曲线形状不代表任何具体指数，也不预测下一阶段何时到来。</text></svg>
