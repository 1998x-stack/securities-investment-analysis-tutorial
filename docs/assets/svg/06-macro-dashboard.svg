<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">GDP、CPI、PMI：变化的分母完全不同</title><desc id="svgDesc">三个指标分别衡量产出、价格变化与企业扩散调查。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">GDP、CPI、PMI：变化的分母完全不同</text><rect x="39" y="100" width="281.3333333333333" height="200" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="39" y="100" width="7" height="200" rx="3" fill="#7461ba"/><text x="57" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">GDP 实际增速</text><text x="57" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">产出规模增长</text><text x="57" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">从6%降至4%仍是增长</text><rect x="338.3333333333333" y="100" width="281.3333333333333" height="200" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="338.3333333333333" y="100" width="7" height="200" rx="3" fill="#147f80"/><text x="356.3333333333333" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">CPI 同比</text><text x="356.3333333333333" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">消费价格变化</text><text x="356.3333333333333" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">通胀降温不等于通缩</text><rect x="637.6666666666666" y="100" width="281.3333333333333" height="200" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="637.6666666666666" y="100" width="7" height="200" rx="3" fill="#d06d4d"/><text x="655.6666666666666" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">PMI 扩散指数</text><text x="655.6666666666666" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">50是扩张收缩临界</text><text x="655.6666666666666" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">49 → 49.5仍低于50</text><path d="M40,339 L918,339" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="44" y="374" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">同样是数字下行，含义可以截然不同。</text><text x="44" y="402" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">所有数字仅为教学构造，并非2026年任何真实数据。</text></svg>
