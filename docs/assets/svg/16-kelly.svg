<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">对数增长率随下注比例的倒U形曲线</title><desc id="d">胜率60%、赔率2:1时，长期对数增长率在仓位约40%处达到最大；横轴超过该点后增长率下降，过度下注反而降低长期增长。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">凯利公式找到的是长期增长率最高点，不是收益最高点</text><path d="M120 92L120 380L880 380" stroke="#203035" stroke-width="2" fill="none"/><path d="M162 185.5L880 185.5" stroke="#c7d8d2" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path d="M120.0 185.5 L158.0 166.9 L196.0 151.3 L234.0 138.5 L272.0 128.2 L310.0 120.3 L348.0 114.6 L386.0 111.2 L424.0 110.0 L462.0 111.2 L500.0 114.9 L538.0 121.5 L576.0 131.3 L614.0 144.9 L652.0 163.3 L690.0 188.0 L728.0 221.4 L766.0 268.5 L804.0 340.0" fill="none" stroke="#147f80" stroke-width="3.5"/><path d="M424 110L424 380" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5" fill="none"/><circle cx="424" cy="110" r="5.5" fill="#7461ba"/><text x="434" y="104" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#7461ba">f* = 40%</text><circle cx="272" cy="128.2" r="5.5" fill="#d06d4d"/><text x="150" y="120" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#d06d4d">半凯利 20%</text><text x="40" y="82" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">长期对数增长率</text><text x="120" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">仓位 0</text><text x="800" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">90%</text><text x="600" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">60%</text><text x="360" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">40%</text><text x="180" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">10%</text><text x="40" y="430" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：按 g(f)=p·ln(1+bf)+(1−p)·ln(1−f)，p=0.60、b=2 精确绘制；假设每期独立同分布，现实胜率并非已知常数。</text></svg>
