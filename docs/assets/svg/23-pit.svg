<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-23t desc-23t"><title id="title-23t">财报的初次披露和更正版本都有各自的可用时间</title><desc id="desc-23t">历史回测不得把更正版数值提前覆盖初始公告。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">财报的初次披露和更正版本都有各自的可用时间</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">历史回测不得把更正版数值提前覆盖初始公告。</text><path d="M68 235H890" stroke="#c7d8d2" stroke-width="3"/><path d="M130 217V254" stroke="#147f80" stroke-width="4"/><text x="130" y="176" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">季度截止</text><text x="130" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">仅财报所属期</text><path d="M360 217V254" stroke="#7461ba" stroke-width="4"/><text x="360" y="176" fill="#7461ba" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">初次公告</text><text x="360" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">最早合法可用</text><path d="M590 217V254" stroke="#916c22" stroke-width="4"/><text x="590" y="176" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">更正公告</text><text x="590" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">修订信息进入</text><path d="M820 217V254" stroke="#d06d4d" stroke-width="4"/><text x="820" y="176" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle">研究决策</text><text x="820" y="282" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle">只能选当时版本</text><rect x="75" y="326" width="810" height="74" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="100" y="368" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">查询条件：available_at ≤ decision_time，并保留原始版本。</text></svg>