="2.5" marker-end="url(#arr)"/><rect x="396" y="101" width="168" height="166" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="2"/><rect x="396" y="101" width="7" height="166" rx="3" fill="#d06d4d"/><text x="413" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">估值假设</text><text x="413" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">折现和敏感性</text><text x="413" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">06—12</text><path d="M566 184L572 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="574" y="101" width="168" height="166" rx="10" fill="#fff" stroke="#b28a37" stroke-width="2"/><rect x="574" y="101" width="7" height="166" rx="3" fill="#b28a37"/><text x="591" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">组合风险</text><text x="591" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">仓位与尾部风险</text><text x="591" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">13—18</text><path d="M744 184L750 184" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="752" y="101" width="168" height="166" rx="10" fill="#fff" stroke="#147f80" stroke-width="2"/><rect x="752" y="101" width="7" height="166" rx="3" fill="#147f80"/><text x="769" y="134" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">实证复盘</text><text x="769" y="166" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">数据与样本外</text><text x="769" y="190" font-family="Arial,'Microsoft 