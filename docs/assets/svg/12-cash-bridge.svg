<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">利润与经营现金：营运资本可以吞噬账面盈利</title><desc id="desc">利润120加折旧20减应收增加35减存货增加25加应付增加15得经营现金95</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">利润与经营现金：营运资本可以吞噬账面盈利</text><rect x="36" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="36" y="118" width="6" height="168" rx="3" fill="#147f80"/><text x="52" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">净利润 120</text><text x="52" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">＋折旧摊销 20</text><text x="52" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">合计 140</text><path d="M246.25 200L260.25 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="262.25" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="262.25" y="118" width="6" height="168" rx="3" fill="#7461ba"/><text x="278.25" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">应收增加 −35</text><text x="278.25" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">收入未及时收款</text><text x="278.25" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">现金减少</text><path d="M472.5 200L486.5 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="488.5" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="488.5" y="118" width="6" height="168" rx="3" fill="#d06d4d"/><text x="504.5" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">库存增加 −25</text><text x="504.5" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">货物占用现金</text><text x="504.5" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">现金减少</text><path d="M698.75 200L712.75 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="714.75" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="714.75" y="118" width="6" height="168" rx="3" fill="#916c22"/><text x="730.75" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">应付增加 ＋15</text><text x="730.75" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">延后供应商付款</text><text x="730.75" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">经营现金 = 95</text><path d="M37 320L925 320" fill="none" stroke="#c2d6cf" stroke-width="2" /><text x="41" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">120 + 20 − 35 − 25 + 15 = 95；如果CapEx为50，粗略结余45。</text><text x="41" y="412" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">本图忽略税收、其他非现金项目及利息分类；经营现金−CapEx并非总等于FCFF。</text></svg>
