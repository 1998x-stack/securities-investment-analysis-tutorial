troke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="488.5" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="488.5" y="118" width="6" height="168" rx="3" fill="#d06d4d"/><text x="504.5" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">反证条件</text><text x="504.5" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">续约跌、应收上升</text><text x="504.5" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">费用高于预算</text><path d="M698.75 200L712.75 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="714.75" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="714.75" y="118" width="6" height="168" rx="3" fill="#916c22"/><text x="730.75" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">更新模型</text><text x="730.75" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">修正增长和利润</text><text x="730.75" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">重估价值区间</text><path d="M37 320L925 320" fill="none" stroke="#c2d6cf" stroke-width="2" /><text x="41" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">把“什么将使我改变主意”写进研究报告，而非价格波动后再补理由。</text><text x="41" y="412" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">股价本身不是证明商业模式成立或错误的充分证据。</text></svg>
