<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">两资产有效前沿构造例子</title><desc id="d">在两资产A和B均值、波动率、零相关假设下，计算不同B权重的预期收益和组合风险，标注最小方差点B权重20%。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="43" font-size="22" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">两资产的有效边界来自所有可实现权重，不是随手画的曲线</text><path d="M103 96L103 364" stroke="#203035" stroke-width="2" fill="none"/><path d="M103 364L895 364" stroke="#203035" stroke-width="2" fill="none"/><path d="M207 339 L181.49173547446986 331.2 L162.51403406569455 323.4 L150.79105675361848 315.6 L146.82349886995218 307.8 L150.79105675361848 300 L162.51403406569455 292.2 L181.49173547446986 284.4 L207.0000000000001 276.6 L238.20815862727616 268.8 L274.2793735874401 261 L314.4372664682687 253.2 L357.99930651839065 245.4 L404.3859850166669 237.6 L453.11580060675215 229.8 L503.7936605674963 222 L556.0973833060348 214.2 L609.7647454549327 206.4 L664.582113507237 198.6 L720.374935098648 190.8 L777 183" stroke="#c7d8d2" stroke-width="3" fill="none"/><path d="M146.82349886995218 307.8 L150.79105675361848 300 L162.51403406569455 292.2 L181.49173547446986 284.4 L207.0000000000001 276.6 L238.20815862727616 268.8 L274.2793735874401 261 L314.4372664682687 253.2 L357.99930651839065 245.4 L404.3859850166669 237.6 L453.11580060675215 229.8 L503.7936605674963 222 L556.0973833060348 214.2 L609.7647454549327 206.4 L664.582113507237 198.6 L720.374935098648 190.8 L777 183" stroke="#147f80" stroke-width="4" fill="none"/><circle cx="207" cy="339" r="6" fill="#d06d4d"/><text x="219" y="328" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#d06d4d">全A</text><circle cx="146.82349886995218" cy="307.8" r="6" fill="#147f80"/><text x="158.82349886995218" y="296.8" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#147f80">20%B</text><circle cx="274.2793735874401" cy="261" r="6" fill="#147f80"/><text x="286.2793735874401" y="250" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#147f80">50%B</text><circle cx="777" cy="183" r="6" fill="#147f80"/><text x="789" y="172" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#147f80">全B</text><text x="38" y="93" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">期望收益</text><text x="717" y="390" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" text-anchor="start" fill="#203035">组合标准差</text><text x="40" y="417" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="400" text-anchor="start" fill="#53676d">A:均值6%/波动10%，B:均值12%/波动20%，ρ=0；允许0–100%权重不卖空。</text></svg>