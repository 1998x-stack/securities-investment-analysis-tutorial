<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">模型投产后的持续监控与暂停机制</title><desc id="desc">数据新鲜度、模型漂移、风险限额、执行成本和对账异常各自设阈值；暂停新交易与恢复权限应有责任人。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#147f80"/></marker><marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#d06d4d"/></marker></defs><rect width="960" height="440" rx="18" fill="#fffdf9"/>
<rect x="30" y="75" width="900" height="110" rx="13" fill="#e8f2ef" stroke="#147f80"/>
<text x="480" y="110" text-anchor="middle" font-size="21" font-weight="700" fill="#203035">监控指标</text>
<text x="135" y="151" text-anchor="middle" font-size="15" fill="#53676d">数据新鲜度</text><text x="355" y="151" text-anchor="middle" font-size="15" fill="#53676d">预测 / 特征漂移</text><text x="580" y="151" text-anchor="middle" font-size="15" fill="#53676d">集中度 / 回撤</text><text x="810" y="151" text-anchor="middle" font-size="15" fill="#53676d">滑点 / 对账</text>
<path d="M480 185 V230 M200 230 H760" stroke="#147f80" stroke-width="3" fill="none"/><path d="M200 230 V270 M480 230 V270 M760 230 V270" stroke="#147f80" stroke-width="3" fill="none"/>
<rect x="75" y="270" width="250" height="95" rx="13" fill="#e8f2ef"/><text x="200" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">正常</text><text x="200" y="337" text-anchor="middle" font-size="15" fill="#53676d">按既定限额运行</text>
<rect x="355" y="270" width="250" height="95" rx="13" fill="#f7f3e9"/><text x="480" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">预警</text><text x="480" y="337" text-anchor="middle" font-size="15" fill="#53676d">复核数据与模型输出</text>
<rect x="635" y="270" width="250" height="95" rx="13" fill="#f9e9e2"/><text x="760" y="307" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">暂停 / 熔断</text><text x="760" y="337" text-anchor="middle" font-size="15" fill="#53676d">停止新单、对账、人工批准</text>
<text x="480" y="410" text-anchor="middle" font-size="14" fill="#53676d">恢复必须记录事件原因、修复证据、批准人和模型版本</text></svg>