<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r18 d-r18"><title id="t-r18">三类常见策略的研究对象不同，不能只凭名称选边站</title><desc id="d-r18">价值看价格相对基本面，成长看未来现金流扩张，动量看既有相对表现是否延续。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">三类常见策略的研究对象不同，不能只凭名称选边站</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">价值看价格相对基本面，成长看未来现金流扩张，动量看既有相对表现是否延续。</text><rect x="45" y="125" width="275" height="220" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="45" y="125" width="7" height="220" rx="4" fill="#147f80"/><text x="65" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">价值 / Value</text><text x="65" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">核心问题：价格相对内在价值</text><text x="65" y="208" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">观测：现金流、资产、盈利</text><text x="65" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">主要风险：价值陷阱、估值重估</text><text x="65" y="252" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">持有纪律：估值变化与基本面复核</text><rect x="342" y="125" width="275" height="220" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="342" y="125" width="7" height="220" rx="4" fill="#7461ba"/><text x="362" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">成长 / Growth</text><text x="362" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">核心问题：未来现金流如何扩张</text><text x="362" y="208" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">观测：市场空间、ROIC、再投资</text><text x="362" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">主要风险：竞争、融资、预期过高</text><text x="362" y="252" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">持有纪律：增长质量与稀释</text><rect x="639" y="125" width="275" height="220" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="639" y="125" width="7" height="220" rx="4" fill="#d06d4d"/><text x="659" y="158" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">动量 / Momentum</text><text x="659" y="186" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">核心问题：相对强弱是否延续</text><text x="659" y="208" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">观测：过去收益、趋势、风险</text><text x="659" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">主要风险：反转与动量崩跌</text><text x="659" y="252" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">持有纪律：规则、换手与止损</text><text x="480" y="398" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#53676d">风格不是互斥的人格标签；组合权重取决于目标、约束与成本。</text></svg>