nt-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">卖出印花税</text><text x="235" y="175" font-size="12" text-anchor="middle" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">卖出佣金</text><text x="330" y="175" font-size="12" text-anchor="middle" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">双向滑点 / 冲击</text><text x="60" y="80" font-size="13" fill="#203035" style=";fill:rgb(32, 48, 53);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">总成本</text><text x="430" y="120" font-size="13" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">滑点与冲击随规模上升，</text><text x="430" y="142" font-size="13" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">不能用单一固定值代替。</text><text x="60" y="205" font-size="12" fill="#53676d" style=";fill:rgb(83, 103, 109);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Arial, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">教学示意：各段比例仅为说明叠加关系，不代表任何实际费率。</text></g></svg>
