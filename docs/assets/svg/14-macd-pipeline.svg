<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">MACD是连续滤波器的差，不是独立的未来价格预言</title><desc id="desc">快EMA和慢EMA来自同一收盘价序列，其差再进行信号平滑</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="46" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">MACD是连续滤波器的差，不是独立的未来价格预言</text><rect x="36" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="36" y="118" width="6" height="168" rx="3" fill="#147f80"/><text x="52" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">输入：收盘价</text><text x="52" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">已完成K线</text><text x="52" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">历史价格序列</text><path d="M246.25 200L260.25 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="262.25" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="262.25" y="118" width="6" height="168" rx="3" fill="#7461ba"/><text x="278.25" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">两条EMA</text><text x="278.25" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">快线12、慢线26</text><text x="278.25" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">系数2/(N+1)</text><path d="M472.5 200L486.5 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="488.5" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="488.5" y="118" width="6" height="168" rx="3" fill="#d06d4d"/><text x="504.5" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">DIF</text><text x="504.5" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">快EMA − 慢EMA</text><text x="504.5" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">动量差值</text><path d="M698.75 200L712.75 200" fill="none" stroke="#147f80" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="714.75" y="118" width="208.25" height="168" rx="10" fill="#fff" stroke="#c2d6cf" stroke-width="1.6"/><rect x="714.75" y="118" width="6" height="168" rx="3" fill="#916c22"/><text x="730.75" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">DEA与柱体</text><text x="730.75" y="185" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">DEA=EMA9(DIF)</text><text x="730.75" y="209" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">柱=DIF−DEA</text><path d="M37 320L925 320" fill="none" stroke="#c2d6cf" stroke-width="2" /><text x="41" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">部分软件把柱形写为2×(DIF−DEA)，此处采用未乘2的口径。</text><text x="41" y="412" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">EMA初始化、缺失值、复权、采样频率可能造成不同平台显示差异。</text></svg>
