<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-23a desc-23a"><title id="title-23a">2拆1不是投资者财富损失50%</title><desc id="desc-23a">报价变化需要和持股数量一同解释。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">2拆1不是投资者财富损失50%</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">报价变化需要和持股数量一同解释。</text><rect x="45" y="140" width="405" height="180" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="45" y="140" width="8" height="180" rx="3" fill="#147f80"/><text x="64" y="172" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">拆股前</text><text x="64" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">100股 × 100元</text><text x="64" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">理论市值10000元</text><text x="64" y="245" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">原始价格为100</text><rect x="510" y="140" width="405" height="180" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><rect x="510" y="140" width="8" height="180" rx="3" fill="#d06d4d"/><text x="529" y="172" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">拆股后</text><text x="529" y="201" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">200股 × 50元</text><text x="529" y="223" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">理论市值10000元</text><text x="529" y="245" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">原始价格为50</text><rect x="64" y="346" width="832" height="55" fill="#fff" stroke="#c7d8d2" stroke-width="1.5" rx="12"/><text x="85" y="379" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="start">复权计算需要明确锚定日；拆股复权不等于分红总回报。</text></svg>