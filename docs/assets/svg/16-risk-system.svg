<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t-r16 d-r16"><title id="t-r16">风险管理不是一个VaR数字，而是一条治理闭环</title><desc id="d-r16">识别风险暴露 → 估计损失分布 → 设定承受能力 → 限额、对冲与复盘。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="38" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203035">风险管理不是一个VaR数字，而是一条治理闭环</text><text x="38" y="74" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">识别风险暴露 → 估计损失分布 → 设定承受能力 → 限额、对冲与复盘。</text><rect x="42" y="130" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="42" y="130" width="7" height="112" rx="4" fill="#147f80"/><text x="62" y="163" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#147f80">01 识别暴露</text><text x="62" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">股票、利率、汇率</text><text x="62" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">信用、流动性、杠杆</text><path d="M235 185 L270 185" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="280" y="130" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="280" y="130" width="7" height="112" rx="4" fill="#7461ba"/><text x="300" y="163" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#7461ba">02 量化风险</text><text x="300" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">波动率、相关性</text><text x="300" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">VaR、ES、敏感度</text><path d="M473 185 L508 185" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="518" y="130" width="190" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="518" y="130" width="7" height="112" rx="4" fill="#916c22"/><text x="538" y="163" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#916c22">03 判断承受力</text><text x="538" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">资本与风险预算</text><text x="538" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">期限、赎回与现金</text><path d="M711 185 L746 185" fill="none" stroke="#147f80" stroke-width="3"  marker-end="url(#arr)"/><rect x="756" y="130" width="165" height="112" rx="12" fill="#fff" stroke="#c7d8d2" stroke-width="1.5"/><rect x="756" y="130" width="7" height="112" rx="4" fill="#d06d4d"/><text x="776" y="163" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#d06d4d">04 行动复核</text><text x="776" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">限额、对冲</text><text x="776" y="213" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#53676d">压力测试、升级</text><rect x="42" y="295" width="879" height="96" rx="12" fill="#fff" stroke="#c7d8d2"/><text x="64" y="325" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#203035">闭环校准</text><text x="64" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203035">市场数据变化</text><path d="M180 350 L280 350" fill="none" stroke="#147f80" stroke-width="2"  marker-end="url(#arr)"/><text x="300" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203035">模型假设检查</text><path d="M425 350 L525 350" fill="none" stroke="#147f80" stroke-width="2"  marker-end="url(#arr)"/><text x="545" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203035">压力情景与流动性</text><path d="M690 350 L790 350" fill="none" stroke="#147f80" stroke-width="2"  marker-end="url(#arr)"/><text x="810" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#203035">更新限额</text></svg>