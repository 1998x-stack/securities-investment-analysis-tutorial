<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">月度IC序列与ICIR的含义</title><desc id="d">12个月度信息系数围绕零轴波动，均值约为0.021；ICIR等于IC均值除以IC标准差，衡量预测的稳定性而非单期强弱。</desc><rect width="960" height="450" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">IC均值说明“方向对不对”，ICIR说明“稳不稳定”</text><path d="M120 255L880 255" stroke="#203035" stroke-width="2" fill="none"/><path d="M120 80L120 380" stroke="#203035" stroke-width="2" fill="none"/><rect x="140" y="130.0" width="40" height="125.0" fill="#147f80" rx="3"/><rect x="200" y="255.0" width="40" height="50.0" fill="#d06d4d" rx="3"/><rect x="260" y="180.0" width="40" height="75.0" fill="#147f80" rx="3"/><rect x="320" y="230.0" width="40" height="25.0" fill="#147f80" rx="3"/><rect x="380" y="105.0" width="40" height="150.0" fill="#147f80" rx="3"/><rect x="440" y="255.0" width="40" height="75.0" fill="#d06d4d" rx="3"/><rect x="500" y="155.0" width="40" height="100.0" fill="#147f80" rx="3"/><rect x="560" y="205.0" width="40" height="50.0" fill="#147f80" rx="3"/><rect x="620" y="130.0" width="40" height="125.0" fill="#147f80" rx="3"/><rect x="680" y="255.0" width="40" height="25.0" fill="#d06d4d" rx="3"/><rect x="740" y="180.0" width="40" height="75.0" fill="#147f80" rx="3"/><rect x="800" y="205.0" width="40" height="50.0" fill="#147f80" rx="3"/><path d="M120 203L880 203" stroke="#7461ba" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="820" y="196" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#7461ba">IC均值≈0.021</text><text x="126" y="272" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">0</text><text x="140" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">1月</text><text x="740" y="400" font-size="13" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">11月</text><text x="40" y="432" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：12 个月的 IC 为构造序列，均值约 0.021、标准差约 0.029、ICIR≈0.73；不代表任何真实因子的历史表现。</text></svg>
