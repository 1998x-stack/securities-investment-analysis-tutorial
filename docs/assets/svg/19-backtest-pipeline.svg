<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">因子回测的四个步骤</title><desc id="d">数据准备、信号生成、组合构建、绩效评估四个环节依次相连，每个环节都可能引入偏差。</desc><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#7461ba"/></marker></defs><rect width="960" height="300" fill="#f3f7f5" rx="14"/><text x="36" y="44" font-size="21" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#203035">回测是一条链：每个环节的假设都会传到最终绩效</text><rect x="40" y="140" width="180" height="64" rx="10" fill="#147f80"/><text x="130" y="180" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">数据准备</text><rect x="280" y="140" width="180" height="64" rx="10" fill="#147f80"/><text x="370" y="180" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">信号生成</text><rect x="520" y="140" width="180" height="64" rx="10" fill="#147f80"/><text x="610" y="180" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">组合构建</text><rect x="760" y="140" width="160" height="64" rx="10" fill="#147f80"/><text x="840" y="180" font-size="16" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">绩效评估</text><path d="M220 172L270 172" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#a2)"/><path d="M460 172L510 172" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#a2)"/><path d="M700 172L750 172" stroke="#7461ba" stroke-width="3" fill="none" marker-end="url(#a2)"/><text x="40" y="248" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">数据准备含退市与停牌处理；信号生成应使用当时可得的信息；组合构建需写明权重与调仓频率；绩效评估需含交易成本。</text><text x="40" y="276" font-size="14" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d">教学示意：流程本身与任何具体策略无关，仅用于定位偏差可能出现的位置。</text></svg>
