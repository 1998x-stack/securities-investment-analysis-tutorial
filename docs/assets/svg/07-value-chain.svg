<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">价值链不同环节留存的利润率可能差别很大</title><desc id="svgDesc">虚构原材料制造渠道售后的四个环节利润率例子。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">价值链不同环节留存的利润率可能差别很大</text><rect x="39" y="100" width="206.5" height="200" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="39" y="100" width="7" height="200" rx="3" fill="#7461ba"/><text x="57" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">原材料端</text><text x="57" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">议价 / 资源稀缺</text><text x="57" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">营业利润率 12%</text><rect x="263.5" y="100" width="206.5" height="200" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="263.5" y="100" width="7" height="200" rx="3" fill="#147f80"/><text x="281.5" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">生产制造</text><text x="281.5" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">规模 / 良率</text><text x="281.5" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">营业利润率 8%</text><rect x="488" y="100" width="206.5" height="200" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="488" y="100" width="7" height="200" rx="3" fill="#d06d4d"/><text x="506" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">渠道销售</text><text x="506" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">客户 / 库存</text><text x="506" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">营业利润率 18%</text><rect x="712.5" y="100" width="206.5" height="200" rx="10" fill="#fff" stroke="#a57c28" stroke-width="1.7"/><rect x="712.5" y="100" width="7" height="200" rx="3" fill="#a57c28"/><text x="730.5" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">售后服务</text><text x="730.5" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">服务黏性</text><text x="730.5" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">营业利润率 24%</text><path d="M40,339 L918,339" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="44" y="374" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">利润率≠整条产业链贡献比例，不能将这些数字直接相加。</text><text x="44" y="402" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">全为构造案例，比较前还须统一收入和利润会计口径。</text></svg>
