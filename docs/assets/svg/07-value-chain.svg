<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">价值链：收入在各环节转移，增加值不等于净利润</title><desc id="fig-desc">原料、制造、渠道、服务共同构成假设产业链，售价100元扣主要成本未必为净利润。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="39" y="45" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">价值链：收入在各环节转移，增加值不等于净利润</text><rect x="40" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="40" y="110" width="6" height="166" rx="3" fill="#147f80"/><text x="56" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">原料</text><text x="56" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">成本 35</text><text x="56" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">资源稀缺与定价</text><path d="M247.75 191L261.75 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="264.75" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="264.75" y="110" width="6" height="166" rx="3" fill="#7461ba"/><text x="280.75" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">制造</text><text x="280.75" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">成本 25</text><text x="280.75" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">产能和良率</text><path d="M472.5 191L486.5 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="489.5" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="489.5" y="110" width="6" height="166" rx="3" fill="#d06d4d"/><text x="505.5" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">渠道</text><text x="505.5" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">成本 20</text><text x="505.5" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">库存与账期</text><path d="M697.25 191L711.25 191" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/><rect x="714.25" y="110" width="205.75" height="166" rx="10" fill="#fff" stroke="#c9d9d4" stroke-width="1.5"/><rect x="714.25" y="110" width="6" height="166" rx="3" fill="#b28a37"/><text x="730.25" y="142" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">服务</text><text x="730.25" y="172" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">成本 8</text><text x="730.25" y="196" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">客户留存</text><path d="M40 316L920 316" fill="none" stroke="#c9d9d4" stroke-width="2"/><text x="43" y="354" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">终端售价100 − 原料35 − 制造25 − 渠道20 − 服务8 = 12；12还不是净利润。</text><text x="43" y="391" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">需要继续扣除研发、管理、融资、税费与其他项目，不能将剩余金额直接视为利润。</text></svg>
