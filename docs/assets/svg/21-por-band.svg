<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title-21p desc-21p"><title id="title-21p">POR：估计价值带与市场价格之间的距离</title><desc id="desc-21p">本文简化为单点价值参照，不等同原研究的完整多模型价值带。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="14" fill="#f3f7f5"/><text x="35" y="44" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">POR：估计价值带与市场价格之间的距离</text><text x="35" y="72" fill="#53676d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="start">本文简化为单点价值参照，不等同原研究的完整多模型价值带。</text><path d="M90 355H890 M90 355V110" stroke="#c7d8d2" stroke-width="2"/><rect x="125" y="148" width="745" height="91" rx="9" fill="#147f80" opacity=".12"/><path d="M125 172H870" stroke="#147f80" stroke-width="3" stroke-dasharray="7 5"/><path d="M125 220H870" stroke="#916c22" stroke-width="3" stroke-dasharray="7 5"/><path d="M125 290H870" stroke="#d06d4d" stroke-width="3"/><text x="145" y="162" fill="#147f80" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">估值上界16</text><text x="145" y="211" fill="#916c22" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">估值参照15</text><text x="145" y="281" fill="#d06d4d" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="start">市价10</text><text x="480" y="405" fill="#203035" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle">构造：(P−V)/P = −50%；负值不是确定上涨空间。</text></svg>