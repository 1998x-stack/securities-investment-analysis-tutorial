<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">行业生命周期的S型路径</title><desc id="svgDesc">行业渗透率可能经历缓慢起步、加速、趋于成熟以及替代调整。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">行业生命周期：扩张速度通常会减慢</text><path d="M95 340 C255 340,290 334,340 294 S475 148,590 124 S748 105,863 102" stroke="#147f80" stroke-width="5" fill="none"/><path d="M92,108 L868,108" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M92,167 L868,167" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M92,226 L868,226" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M92,285 L868,285" fill="none" stroke="#C9D9D3" stroke-width="1.3" stroke-dasharray="4 5"/><path d="M95 98V351H869" fill="none" stroke="#203035" stroke-width="2"/><text x="177" y="379" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#7461ba" text-anchor="start">导入</text><text x="177" y="401" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">验证需求</text><text x="387" y="379" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">成长</text><text x="387" y="401" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">渗透加速</text><text x="597" y="379" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#a57c28" text-anchor="start">成熟</text><text x="597" y="401" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">增速趋缓</text><text x="807" y="379" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#d06d4d" text-anchor="start">再配置</text><text x="807" y="401" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">替代或更新</text><text x="41" y="434" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#53676d" text-anchor="start">S型曲线为概念模型，不表示具体行业必然遵循同一路径。</text></svg>
