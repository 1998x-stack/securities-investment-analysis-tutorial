<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">行业生命周期非确定路径</title><desc id="fig-desc">示意行业规模可能从导入扩张到成熟并衰退或重塑，强调路径并非预测公式。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect width="960" height="450" rx="12" fill="#f3f7f5"/><text x="38" y="44" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#203035" text-anchor="start">行业发展可能转换阶段，也可能被技术重塑</text><path d="M98 95L98 351" fill="none" stroke="#203035" stroke-width="2"/><path d="M98 351L887 351" fill="none" stroke="#203035" stroke-width="2"/><path d="M109 335 C242 329,287 228,377 161 S540 109,636 125 S773 168,855 279" stroke="#147f80" stroke-width="4" fill="none"/><circle cx="157" cy="324" r="7" fill="#7461ba"/><text x="157" y="302" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#7461ba" text-anchor="middle">导入</text><circle cx="367" cy="171" r="7" fill="#147f80"/><text x="367" y="149" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">扩张</text><circle cx="602" cy="121" r="7" fill="#b28a37"/><text x="602" y="99" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#b28a37" text-anchor="middle">成熟</text><circle cx="783" cy="204" r="7" fill="#d06d4d"/><text x="783" y="182" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#d06d4d" text-anchor="middle">衰退/重塑</text><text x="40" y="391" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#53676d" text-anchor="start">纵轴是行业规模示意；时间与利润率并非必然随阶段单调变化。</text><text x="40" y="423" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">判断需参考订单、渗透率、产能、毛利率、资本进入和退出，而不是贴一个固定“阶段标签”。</text></svg>
