<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">PE、PB与PEG：不同分母对应不同问题</title><desc id="svgDesc">PE是市值除盈利，PB是市值除账面权益，PEG需指定增长率百分数口径。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker></defs><rect x="0" y="0" width="960" height="450" rx="0" fill="#F3F7F5" stroke="#F3F7F5" stroke-width="1.7"/><text x="36" y="45" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">PE、PB与PEG：不同分母对应不同问题</text><rect x="39" y="100" width="281.3333333333333" height="200" rx="10" fill="#fff" stroke="#7461ba" stroke-width="1.7"/><rect x="39" y="100" width="7" height="200" rx="3" fill="#7461ba"/><text x="57" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">PE</text><text x="57" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">市值 / 净利润</text><text x="57" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">受周期与非经常性影响</text><rect x="338.3333333333333" y="100" width="281.3333333333333" height="200" rx="10" fill="#fff" stroke="#147f80" stroke-width="1.7"/><rect x="338.3333333333333" y="100" width="7" height="200" rx="3" fill="#147f80"/><text x="356.3333333333333" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">PB</text><text x="356.3333333333333" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">市值 / 账面权益</text><text x="356.3333333333333" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">受账面资产质量影响</text><rect x="637.6666666666666" y="100" width="281.3333333333333" height="200" rx="10" fill="#fff" stroke="#d06d4d" stroke-width="1.7"/><rect x="637.6666666666666" y="100" width="7" height="200" rx="3" fill="#d06d4d"/><text x="655.6666666666666" y="131" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="start">PEG</text><text x="655.6666666666666" y="162" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">PE / 盈利增长率</text><text x="655.6666666666666" y="186" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">百分数值口径，例如15</text><path d="M40,339 L918,339" fill="none" stroke="#C9D9D3" stroke-width="1.3" /><text x="44" y="374" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">示例：PE 15× / 预期增长率15（即15%）= PEG 1。</text><text x="44" y="402" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#53676d" text-anchor="start">PEG只是经验指标，增长率为零、为负或不稳定时并不稳健。</text></svg>
